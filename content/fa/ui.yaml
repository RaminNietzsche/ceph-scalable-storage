changes_intro: "این پیوست تغییرهای مهم سه نسخه‌ی اصلی Reef (18.2)، Squid (19.2) و Tentacle (20.2) را که به فصل‌های این کتاب مربوط‌اند، برای هر نسخه در یک جدول می‌آورد. ردیف‌های «تأییدشده» در یادداشت‌های رسمی انتشار نسخه‌ی x.2.0 همان نسخه آمده‌اند؛ ردیف‌های «نیازمند بازبینی» از متن فصل‌ها یا یادداشت‌های نسخه‌های نقطه‌ای گرفته شده‌اند و هنوز با یادداشت انتشار اصلی تطبیق داده نشده‌اند. برای تغییرهای Umbrella (21.2) و تاریخ پشتیبانی هر نسخه، پیوست د را ببینید."
changes_badges: "برچسب نسخه: کنار هر کادر کدی که دستور Ceph دارد برچسبی مثل «Reef+» آمده است، یعنی دستور از آن نسخه به بعد بی‌تغییر کار می‌کند. پیش‌فرض کتاب Reef است؛ دستورهای زیر به نسخه‌ای جدیدتر نیاز دارند:"
