md_about_title: "درباره‌ی این اثر"
md_about: "این کتاب یک راهنمای مطالعه‌ی مستقل است و ترجمه‌ی کتاب اصلی نیست. فقط فهرست عمومی سرفصل‌ها مبنای ترتیب مطالب بوده است و متن، مثال‌ها، دستورها، تمرین‌ها و نمودارها نوشته‌ی همین راهنما هستند.\n\nکتاب اصلی: Vikhyat Umrao, Karan Singh, Nick Fisk, Anthony D'Atri, Vaibhav Bhembre, *Ceph: Designing and Implementing Scalable Storage Systems*, 2019. همه‌ی حقوق کتاب اصلی برای نویسندگان و ناشر محفوظ است. تکه‌های کوتاه کد Ceph با ذکر مسیر از github.com/ceph/ceph (LGPL) نقل شده‌اند."
