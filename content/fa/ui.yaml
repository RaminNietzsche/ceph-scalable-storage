part_low_title: "لایه‌های پایینی"
part_low_desc: "یازده فصل این بخش در کتاب اصلی وجود ندارند. آن‌ها Ceph را از پایین‌ترین لایه بازخوانی می‌کنند: دستگاه بلوکی، bufferlist و crc32c؛ قالب روی‌دیسک BlueStore و BlueFS؛ RocksDB؛ msgr2 در سطح بایت؛ ریاضیات erasure coding؛ CRUSH در سطح بیت؛ کلاینت‌های هسته‌ی لینوکس؛ Crimson و SeaStore؛ SPDK و NVMe؛ scrub، recovery و backfill در سطح کد؛ و حافظه و CPU درون OSD. همه‌ی مثال‌های عددی با کد مستقل یا کد کامپایل‌شده‌ی Ceph دوباره محاسبه شده‌اند."
part_low_md: "فصل‌های ۲۳ تا ۳۳ در کتاب اصلی وجود ندارند و Ceph را از پایین‌ترین لایه بازخوانی می‌کنند."
