index: "نمایه"
glossary_intro: "در این پیوست اصطلاحات کلیدی به‌کاررفته در کتاب به ترتیب الفبای انگلیسی همراه با معادل فارسی و توضیحی کوتاه آمده‌اند. برای یافتن جای کاربرد هر اصطلاح در متن، به نمایه‌ی پایان کتاب مراجعه کنید."
glossary_cols: ["اصطلاح", "معادل فارسی و توضیح"]
cheatsheet_intro: "دستورهای کلیدی Ceph در ۱۴ دسته‌ی عملیاتی—از وضعیت کلاستر، MON/MGR، چرخه‌ی عمر OSD، Pool/CRUSH، ترازگر و BlueStore تا RBD، CephFS، RGW و multisite، cephx، cephadm، ارتقا، عیب‌یابی و بنچمارک. هر ردیف به بخش مربوط در کتاب پیوند دارد. دستورهای پرخطر با برچسب <span class=\"cs-danger-tag\">⚠ خطرناک</span> مشخص شده‌اند؛ پیش از اجرای آن‌ها روی محیط تولید، شناسه‌ی کلاستر (<code>ceph fsid</code>) و وضعیت فعلی (<code>ceph -s</code>) را بررسی کنید. دستورهایی که به نسخه‌ای جدیدتر از Reef نیاز دارند برچسب نسخه دارند (مثلاً <span class=\"en\" dir=\"ltr\">Squid+</span>)؛ بقیه از Reef (<span class=\"en\" dir=\"ltr\">18.2</span>) به بعد بی‌تغییر کار می‌کنند."
cheatsheet_cols: ["دستور", "توضیح", "بخش"]
cheatsheet_index_title: "نمایه‌ی همه‌ی دستورهای فصل‌ها"
cheatsheet_index_intro: "همه‌ی خط‌های دستوری که در کادرهای کد فصل‌ها آمده‌اند، بر اساس ابزار و زیردستور؛ ستون کناری فصل نخستین کاربرد را نشان می‌دهد."
cheatsheet_danger: "⚠ خطرناک"
answers_intro: "پاسخ‌های زیر کوتاه و راهنما هستند؛ برای توضیح کامل به بخش «تکمیلی و به‌روز» همان فصل برگردید."
bib_intro: "این کتاب‌نامه همه‌ی منابعی را که در بخش‌های «منابع این فصل» آمده‌اند، به‌همراه منابع عمومی، یک‌جا گرد می‌آورد. همه‌ی پیوندها در آبان ۱۴۰۵ بررسی و در دسترس بوده‌اند. مستندات رسمی پروژه‌ها همیشه به‌روزترین منبع‌اند؛ پیش از به‌کارگیری هر قابلیت در production، مستندات نسخه‌ی مورد استفاده‌ی خود را بخوانید."
