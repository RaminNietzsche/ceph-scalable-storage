algo_list_intro: "این پیوست همه‌ی {n} کادر «الگوریتم» کتاب را به ترتیب فصل فهرست می‌کند. هر کادر شامل توضیح فارسی، شبه‌کد، پیچیدگی، مثال عددی و دست‌کم یک شکل است. ستون «منبع» فایل و تابعی از کد را نشان می‌دهد که الگوریتم از آن استخراج و با آن تطبیق داده شده است. ستون صفحه به خود کادر الگوریتم پیوند دارد."
