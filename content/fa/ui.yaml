part_low_title: "لایه‌های پایینی"
part_low_desc: "یازده فصل این بخش Ceph را از پایین‌ترین لایه بازخوانی می‌کنند: دستگاه بلوکی، bufferlist و crc32c؛ قالب روی‌دیسک BlueStore و BlueFS؛ RocksDB؛ msgr2 در سطح بایت؛ ریاضیات erasure coding؛ CRUSH در سطح بیت؛ کلاینت‌های هسته‌ی لینوکس؛ Crimson و SeaStore؛ SPDK و NVMe؛ scrub، recovery و backfill در سطح کد؛ و حافظه و CPU درون OSD. همه‌ی مثال‌های عددی با کد مستقل یا کد کامپایل‌شده‌ی Ceph دوباره محاسبه شده‌اند."
part_low_md: "فصل‌های ۲۳ تا ۳۳ Ceph را از پایین‌ترین لایه بازخوانی می‌کنند."
part_spec_toc: "بخش چهارم: بخش تخصصی RADOS، RBD و RGW (فصل‌های ۳۴ تا ۴۲)"
part_spec_word: "بخش چهارم"
part_spec_title: "بخش تخصصی: RADOS، RBD و RGW"
part_spec_desc: "نه فصل این بخش سه زیرسامانه‌ی اصلی Ceph را تخصصی و عمیق بررسی می‌کنند: RADOS (مدل شیء و مسیر op در OSD، peering و pg log، snapshot و clone)، RBD (چیدمان image در RADOS، مسیر I/O در librbd و krbd، و rbd-mirror) و RGW (چیدمان داده و ایندکس، مسیر درخواست، و درون multisite). فصل‌های پیشین هر موضوع را معرفی کرده‌اند؛ این بخش ساختار داده‌ها، الگوریتم‌ها و دستورها را با کد شاخه‌ی main تطبیق می‌دهد و آن مقدمه‌ها را تکرار نمی‌کند."
part_spec_md: "فصل‌های ۳۴ تا ۴۲ RADOS، RBD و RGW را تخصصی و در سطح کد بررسی می‌کنند."
