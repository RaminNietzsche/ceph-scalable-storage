crushtool: کامپایل و آزمون نقشه‌ی CRUSH
ceph-dencoder: decode ساختارهای باینری
kubectl: Kubernetes (Rook)
ceph-mon: daemon مانیتور
monmaptool: کار با MonMap
cephfs-journal-tool: ابزار journal در CephFS
ceph-kvstore-tool: بازرسی RocksDB
