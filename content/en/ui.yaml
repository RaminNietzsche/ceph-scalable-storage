md_about: "This book is an independent study guide and is not a translation of the original book. Only the original's public table of contents was used to order the topics; the text, examples, commands, exercises and figures were written for this guide. The English edition is a translation of the original Persian text.\n\nOriginal book: Vikhyat Umrao, Karan Singh, Nick Fisk, Anthony D'Atri, Vaibhav Bhembre, *Ceph: Designing and Implementing Scalable Storage Systems*, 2019. All rights to the original book remain with its authors and publisher. Short excerpts of Ceph code are quoted with their paths from github.com/ceph/ceph (LGPL)."
