cheatsheet_intro: "Essential Ceph commands organized into 14 operational categories—from cluster health, MON/MGR, OSD lifecycle, pools/CRUSH, balancer, and BlueStore to RBD, CephFS, RGW/multisite, cephx, cephadm, upgrades, debugging, and benchmarking. Each row links to the section that explains it in depth. Destructive or high-risk commands carry a <span class=\"cs-danger-tag\">⚠ Danger</span> flag; before running them on production, verify the cluster (<code>ceph fsid</code>) and record state (<code>ceph -s</code>). Commands requiring a release newer than Reef carry a release label (for example <span class=\"since s-squid\">Squid+</span>); unlabeled commands work on Reef (18.2) and later."
