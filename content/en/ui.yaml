part_low_desc: "The eleven chapters of this part do not exist in the original book. They revisit Ceph from the lowest layer up: the block device, bufferlist and crc32c; the BlueStore and BlueFS on-disk format; RocksDB; msgr2 at the byte level; erasure-coding mathematics; CRUSH at the bit level; the Linux kernel clients; Crimson and SeaStore; SPDK and NVMe; scrub, recovery and backfill at code level; and memory and CPU inside the OSD. Every numeric example was recomputed with independent code or with compiled Ceph code."
