part_low_title: "Lower Layers"
part_low_desc: "The eleven chapters of this part revisit Ceph from the lowest layer up: the block device, bufferlist and crc32c; the BlueStore and BlueFS on-disk format; RocksDB; msgr2 at the byte level; erasure-coding mathematics; CRUSH at the bit level; the Linux kernel clients; Crimson and SeaStore; SPDK and NVMe; scrub, recovery and backfill at code level; and memory and CPU inside the OSD. Every numeric example was recomputed with independent code or with compiled Ceph code."
part_low_md: "Chapters 23–33 revisit Ceph from the lowest layer up."
part_spec_toc: "Part IV: Specialist Part on RADOS, RBD and RGW (Chapters 34–42)"
part_spec_word: "Part IV"
part_spec_title: "Specialist Part: RADOS, RBD and RGW"
part_spec_desc: "The nine chapters of this part examine the three main Ceph subsystems in depth: RADOS (the object model and the op path in the OSD, peering and the pg log, snapshots and clones), RBD (the image layout in RADOS, the I/O path in librbd and krbd, and rbd-mirror) and RGW (data and index layout, the request path, and multisite internals). Earlier chapters introduce each topic; this part checks data structures, algorithms and commands against the main branch and does not repeat those introductions."
part_spec_md: "Chapters 34–42 examine RADOS, RBD and RGW in depth, at the code level."
