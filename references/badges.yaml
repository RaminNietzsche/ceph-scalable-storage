# Badge art of the web edition's game layer: categories, frame shapes, tier metals and one
# hand-drawn glyph per badge. tools/render_badges.py turns this file into assets/badges.js
# (SVG defs + a small renderer used by templates/site/game.js); tools/check_badges.py
# validates it against game.js and game.yaml (make check-badges, part of make check).
# Badge ids, XP and unlock rules live in templates/site/game.js; names in templates/site/game.yaml.
# Design notes: docs/GAMIFICATION.md, section "Badge art".
version: 1
count: 52

# Glyph mini-language, on a 24 x 24 grid (stroke glyphs are drawn with round caps and joins):
#   p:<path d>   stroked path          f:<path d>   filled path
#   c:cx,cy,r    stroked circle        d:cx,cy,r    filled circle
#   r:x,y,w,h,rx stroked rectangle     b:x,y,w,h,rx filled rectangle

# Field colours per category (light stop, dark stop). Every category shares one frame shape.
categories:
  reading: {shape: hex, field: ["#60a5fa", "#1e3a8a"], accent: "#2563eb"}
  explore: {shape: hex, field: ["#2dd4bf", "#115e59"], accent: "#0d9488"}
  recall:  {shape: hex, field: ["#a78bfa", "#4c1d95"], accent: "#7c3aed"}
  habit:   {shape: hex, field: ["#fdba74", "#9a3412"], accent: "#ea580c"}
  secret:  {shape: gem, field: ["#f472b6", "#701a75"], accent: "#db2777"}
  labs:    {shape: medal, field: ["#4ade80", "#14532d"], accent: "#16a34a"}

# Rim metals: tier 1 bronze, 2 silver, 3 gold (three stops, light to dark); holo is the rim of an earned secret badge.
metals:
  1: ["#ffd9b0", "#c47a3d", "#6b3410"]
  2: ["#ffffff", "#aeb9c8", "#4f5b6d"]
  3: ["#fff4b8", "#f5b90a", "#8a5a06"]
  holo: ["#f9a8d4", "#c4b5fd", "#67e8f9", "#fde68a"]

# Shared glyphs: the lock on a locked badge and the face of a hidden badge.
glyphs:
  lock: ["r:6,11,12,9,2", "p:M8.5 11V8a3.5 3.5 0 0 1 7 0v3", "d:12,15.5,1.4"]
  secret: ["p:M9 9a3 3 0 1 1 4.5 2.6c-.9.5-1.5 1.2-1.5 2.4", "d:12,18,1.3", "f:M19 3l.6 1.6 1.6.6-1.6.6-.6 1.6-.6-1.6-1.6-.6 1.6-.6z", "d:5,6,.9"]

