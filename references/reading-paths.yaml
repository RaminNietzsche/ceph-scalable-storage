          - ref: appK
            why: {fa: "امنیت RGW از مدل تهدید تا سخت‌سازی: SigV4، ترتیب ارزیابی سیاست‌ها، STS، SSE و Object Lock.", en: "RGW security from threat model to hardening: SigV4, policy evaluation order, STS, SSE and Object Lock."}
