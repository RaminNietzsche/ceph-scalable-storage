  - id: architect
    icon: layers
    short: {fa: "معمار ذخیره‌سازی", en: "Storage architect"}
    title: {fa: "کلاستر را طراحی و ظرفیت‌سنجی می‌کنم", en: "I design and size clusters"}
    who:
      fa: "معمار یا مسئول برنامه‌ریزی ظرفیت که باید پیش از خرید و استقرار، سخت‌افزار، شبکه، سطح حفاظت از داده و رشد را تعیین کند."
      en: "An architect or capacity planner who must settle hardware, network, the level of data protection and growth before buying and deploying."
    prereq:
      fa: "مفاهیم پایه‌ی Ceph (pool، PG، OSD، CRUSH) را می‌دانید؛ اگر نه، اول مسیر «تازه‌وارد». آشنایی با ذخیره‌سازی سازمانی کمک می‌کند."
      en: "You know the basic Ceph concepts (pools, PGs, OSDs, CRUSH); if not, take the newcomer path first. Some enterprise storage background helps."
    outcomes:
      fa:
        - "از نیازمندی تا سخت‌افزار، شبکه و تعداد گره را با عدد توجیه می‌کنید."
        - "بین replication و erasure coding با ظرفیت مفید، هزینه‌ی بازسازی و ترافیک شبکه تصمیم می‌گیرید."
        - "ظرفیت قابل استفاده و رفتار nearfull و full را پیش‌بینی می‌کنید."
        - "عمر SSD و سربار فضای شیءهای کوچک را تخمین می‌زنید."
        - "الگوی حفاظت در برابر خرابی سایت را انتخاب می‌کنید."
      en:
        - "You justify hardware, network and node count with numbers, starting from the requirements."
        - "You choose between replication and erasure coding by usable capacity, rebuild cost and network traffic."
        - "You predict usable capacity and the behaviour at nearfull and full."
        - "You estimate SSD lifetime and the space overhead of small objects."
        - "You choose a protection pattern against the loss of a site."
    next: [sre, s3dev]
    stages:
      - title: {fa: "اندازه‌گیری نیاز", en: "Sizing it"}
        steps:
          - ref: sec-01-5
            why: {fa: "از نیازمندی تا معماری: سخت‌افزار هر دیمن، شبکه، ظرفیت و نسبت‌های پُری، دامنه‌های خرابی و تعداد گره.", en: "From requirements to architecture: hardware per daemon, network, capacity and fill ratios, failure domains and node count."}
          - ref: sec-01-11
            why: {fa: "تعداد PG، احتمال از دست رفتن داده و زمان بازسازی با عدد؛ و مقایسه با RAID.", en: "PG count, the probability of data loss and rebuild time in numbers, and the comparison with RAID."}
          - ref: lab:capacity
            min: 15
            why: {fa: "ظرفیت قابل استفاده و اثر از دست رفتن یک میزبان را پیش از خرید ببینید.", en: "See usable capacity and the effect of losing a host before you buy."}
          - ref: lab:pgcalc
            min: 10
            why: {fa: "تعداد PG در روش کلاسیک و در pg_autoscaler.", en: "PG count by the classic method and by the pg_autoscaler."}
      - title: {fa: "حفاظت از داده", en: "Protecting the data"}
        steps:
          - ref: ch13
            hands_on: 10
            why: {fa: "erasure coding: کجا EC و کجا replication، پلاگین‌ها و پروفایل‌ها، و FastEC.", en: "Erasure coding: where EC and where replication, plugins and profiles, and FastEC."}
          - ref: lab:ecprofile
            min: 10
            why: {fa: "k، m و پلاگین را عوض کنید و ظرفیت مفید و هزینه‌ی ترمیم را مقایسه کنید.", en: "Change k, m and the plugin and compare usable capacity and repair cost."}
          - ref: lab:netbw
            min: 10
            why: {fa: "ترافیک شبکه‌ی عمومی و کلاستر در replication و EC، و بازسازی یک گره.", en: "Public and cluster network traffic with replication and EC, and the rebuild of a node."}
      - title: {fa: "رسانه و چیدمان", en: "Media and layout"}
        steps:
          - ref: sec-08-10
            why: {fa: "یک pool روی OSDهای مشخص: الگو و دام آن.", en: "A pool on specific OSDs: the pattern and its pitfall."}
          - ref: sec-12-4
            why: {fa: "چیدمان دستگاه‌ها، اندازه‌ی block.db، min_alloc_size، فشرده‌سازی و checksum.", en: "Device layout, block.db size, min_alloc_size, compression and checksums."}
          - ref: lab:bluespace
            min: 10
            why: {fa: "یک شیء کوچک واقعاً چقدر فضای خام می‌گیرد.", en: "How much raw disk a small object really takes."}
          - ref: lab:ssdwear
            min: 10
            why: {fa: "به ازای هر بایت کلاینت چند بایت فلش نوشته می‌شود و SSD چند سال می‌ماند.", en: "How many flash bytes are written per client byte, and how long the SSD lasts."}
          - ref: sec-16-7
            optional: true
            why: {fa: "جایگزین‌های امروزی tiering: device class، storage class و تکرارزدایی.", en: "Today's alternatives to tiering: device classes, storage classes and deduplication."}
      - title: {fa: "خرابی و رشد", en: "Failure and growth"}
        steps:
          - ref: sec-18-2
            why: {fa: "لایه‌های دفاعی: از کپی تا پشتیبان مستقل.", en: "The layers of defence, from copies to an independent backup."}
          - ref: sec-05-2
            why: {fa: "مفهوم‌های multisite: سلسله‌مراتب و آنچه همگام می‌شود.", en: "Multisite concepts: the hierarchy and what is replicated."}
          - ref: sec-05-14
            why: {fa: "کارایی و طراحی در چند سایت.", en: "Performance and design across sites."}
          - ref: sec-18-7
            why: {fa: "stretch mode: یک کلاستر روی دو سایت و رفتارش هنگام خرابی.", en: "Stretch mode: one cluster across two sites and its behaviour on failure."}
          - ref: appL
            why: {fa: "انتخاب توپولوژی DR با RPO و RTO: stretch در برابر multisite، RBD mirroring و CephFS mirroring.", en: "Choosing a DR topology by RPO and RTO: stretch versus multisite, RBD mirroring and CephFS mirroring."}
          - ref: sec-10-3
            why: {fa: "خط پایه‌ی سخت‌افزار: قبل از اعتماد به عددهای ادعاشده، دیسک و شبکه را بسنجید.", en: "The hardware baseline: measure disk and network before trusting the claimed numbers."}
          - ref: sec-10-8
            optional: true
            why: {fa: "ساختار یک گزارش سنجش.", en: "How to structure a benchmark report."}
          - ref: appD
            why: {fa: "جدول انتشارها: کدام نسخه تا کی پشتیبانی می‌شود.", en: "The release table: which release is supported until when."}

