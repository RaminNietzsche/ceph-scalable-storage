        - "بین Rook درون Kubernetes و Ceph بیرونی با cephadm آگاهانه انتخاب می‌کنید."
        - "تفاوت PVC بلوکی (RBD) و PVC فایلی (CephFS) را می‌دانید."
        - "برای کلاینت کاربر و capability کمینه می‌سازید."
        - "snapshot و clone یک volume را می‌فهمید."
        - "پایش و عیب‌یابی Ceph را کنار پایش Kubernetes می‌گذارید."
