paths:
  - id: newcomer
    icon: cluster
    short: {fa: "تازه‌وارد", en: "Newcomer"}
    title: {fa: "تازه با Ceph آشنا شده‌ام", en: "I'm new to Ceph"}
    who:
      fa: "دانشجو یا مهندسی که Ceph را تازه شناخته و می‌خواهد بفهمد چیست، چرا ساخته شده و یک کلاستر کوچک چطور بالا می‌آید."
      en: "A student or engineer meeting Ceph for the first time, who wants to know what it is, why it exists and how a small cluster comes up."
    prereq:
      fa: "آشنایی با لینوکس و شبکه، و این‌که RAID چیست. برای بخش عملی حدود چهار ماشین مجازی کوچک لازم است؛ طرح آن در بخش «ساخت آزمایشگاه مجازی» آمده است."
      en: "Some Linux and networking, and what RAID is. The hands-on part needs about four small virtual machines; the layout is in the section on building a virtual lab."
    outcomes:
      fa:
        - "توضیح می‌دهید RADOS، CRUSH، pool و PG هر کدام چه کاری می‌کنند."
        - "با cephadm یک کلاستر کوچک آزمایشی بالا می‌آورید."
        - "با یک image بلوکی، یک bucket شیء و یک فایل‌سیستم CephFS آشنا می‌شوید."
        - "خروجی ceph -s و وضعیت PGها را می‌خوانید."
      en:
        - "You can explain what RADOS, CRUSH, pools and PGs each do."
        - "You bring up a small test cluster with cephadm."
        - "You meet a block image, an object bucket and a CephFS file system."
        - "You can read the output of ceph -s and the PG states."
    next: [sre, s3dev, k8s, architect]
    stages:
      - title: {fa: "چرا Ceph و چگونه ساخته شده", en: "Why Ceph, and how it is built"}
        steps:
          - ref: sec-01-2
            why: {fa: "مسئله از اینجا شروع می‌شود: چرا ذخیره‌سازی نرم‌افزارمحور، و چرا یک بستر برای بلوک، شیء و فایل.", en: "The problem first: why software-defined storage, and why one platform for block, object and file."}
          - ref: sec-01-3
            optional: true
            why: {fa: "اگر با RAID کار کرده‌اید ببینید چرا بازسازی و دیسک یدک دیگر جواب نمی‌دهد؛ اگر نه، از آن بگذرید.", en: "If you have run RAID, see why rebuilds and spare disks stop working at this scale; if not, skip it."}
          - ref: sec-01-4
            why: {fa: "نقشه‌ی ذهنی کل سامانه: RADOS، دیمن‌ها، CRUSH، pool و مسیر نوشتن یک شیء.", en: "The mental map of the whole system: RADOS, the daemons, CRUSH, pools and the path of a written object."}
          - ref: lab:placement
            min: 15
            why: {fa: "نام یک شیء را بنویسید و ببینید چطور به PG و OSD می‌رسد. چیزی لازم نیست نصب کنید.", en: "Type an object name and watch it become a PG and then OSDs. Nothing to install."}
      - title: {fa: "نخستین کلاستر", en: "Your first cluster"}
        steps:
          - ref: sec-01-6
            hands_on: 30
            why: {fa: "ماشین‌های آزمایشگاه را آماده کنید: چند گره، چند دیسک، چه شبکه‌ای.", en: "Prepare the lab machines: how many nodes, how many disks, which network."}
          - ref: sec-01-7
            hands_on: 30
            why: {fa: "با cephadm کلاستر را bootstrap و میزبان‌ها و OSDها را اضافه کنید.", en: "Bootstrap the cluster with cephadm and add hosts and OSDs."}
          - ref: sec-01-9
            hands_on: 20
            why: {fa: "روی کلاستر خودتان pool بسازید، شیء بنویسید، PGها را ببینید و یک دیسک بلوکی بسازید.", en: "On your own cluster: create a pool, write objects, look at PGs and make a block device."}
      - title: {fa: "سه رابط کاربری", en: "The three interfaces"}
        steps:
          - ref: sec-02-4
            hands_on: 15
            why: {fa: "ساخت، map و تغییر اندازه‌ی یک image بلوکی RBD.", en: "Creating, mapping and resizing an RBD block image."}
          - ref: sec-04-2
            why: {fa: "شیء، bucket و API در Ceph: RGW چیست و روی RADOS چطور می‌نشیند.", en: "Objects, buckets and the API in Ceph: what RGW is and how it sits on RADOS."}
          - ref: sec-06-2
            hands_on: 15
            why: {fa: "CephFS و MDS: معماری، ساخت یک فایل‌سیستم و دسترس‌پذیری.", en: "CephFS and the MDS: the architecture, creating a file system and availability."}
      - title: {fa: "خواندن زبان کلاستر", en: "Reading the cluster's language"}
        steps:
          - ref: sec-08-3
            why: {fa: "سلسله‌مراتب، وزن و قاعده‌های CRUSH؛ بدون این‌ها خروجی ceph osd tree مبهم می‌ماند.", en: "The hierarchy, weights and rules of CRUSH; without them the output of ceph osd tree stays opaque."}
          - ref: lab:crush
            min: 15
            why: {fa: "یک درخت CRUSH بسازید، یک OSD را out کنید و ببینید کدام PGها جابه‌جا می‌شوند.", en: "Build a CRUSH tree, mark an OSD out and see which PGs move."}
          - ref: sec-08-9
            why: {fa: "مسیر نوشتن، وضعیت‌های PG و معنی size و min_size: همان چیزهایی که در ceph -s می‌بینید.", en: "The write path, the PG states and what size and min_size mean: the things you see in ceph -s."}
          - ref: appB
            optional: true
            min: 20
            why: {fa: "برگه‌ی دستورها را کنار دستتان نگه دارید.", en: "Keep the command cheat sheet at hand."}

  - id: sre
    icon: ops
    short: {fa: "SRE و اپراتور", en: "SRE / operator"}
    title: {fa: "کلاستر تولیدی را اداره می‌کنم", en: "I run Ceph in production"}
    who:
      fa: "مهندس SRE یا اپراتوری که مسئول سلامت، ظرفیت و ارتقای یک کلاستر در حال سرویس است و هنگام حادثه باید سریع تصمیم بگیرد."
      en: "An SRE or operator responsible for the health, capacity and upgrades of a live cluster, who has to decide quickly during an incident."
    prereq:
      fa: "کار با لینوکس و دستورهای پایه‌ی ceph، و آشنایی با pool، PG و OSD (مسیر «تازه‌وارد» یا فصل ۱ کافی است). بهتر است به یک کلاستر آزمایشی دسترسی داشته باشید."
      en: "Linux and the basic ceph commands, and a feel for pools, PGs and OSDs (the newcomer path or chapter 1 is enough). Access to a test cluster helps."
    outcomes:
      fa:
        - "کلاستر را با یک روال ثابت کنترل می‌کنید: سلامت، ظرفیت و هشدارها."
        - "دیسک و میزبان را با روش درست تعویض و نگهداری می‌کنید."
        - "هنگام HEALTH_WARN یا PG گیرکرده روش‌مند عیب‌یابی می‌کنید و ابزارهای خطرناک را می‌شناسید."
        - "می‌دانید در بدترین حالت، مثلاً از دست رفتن همه‌ی MONها، چه راهی هست."
        - "ارتقا و تنظیم کارایی را با روال امن انجام می‌دهید."
      en:
        - "You check the cluster with a fixed routine: health, capacity and alerts."
        - "You replace disks and take hosts out for maintenance the right way."
        - "You troubleshoot HEALTH_WARN and stuck PGs with a method, and you know the dangerous tools."
        - "You know what to do in the worst cases, such as losing every MON."
        - "You upgrade and tune with a safe routine."
    next: [upgrade, architect, contributor]
    stages:
      - title: {fa: "راهبری روزانه", en: "Day-to-day operation"}
        steps:
          - ref: ch7
            hands_on: 20
            why: {fa: "سرویس‌ها، پیکربندی، رشد و کوچک‌کردن کلاستر، تعویض دیسک و ظرفیت.", en: "Services, configuration, growing and shrinking the cluster, replacing disks and capacity."}
          - ref: ch19
            hands_on: 30
            why: {fa: "تعویض دیسک، نگهداری میزبان، پرچم‌های نگهداری، autoscaler و balancer. در بار اول بخش‌های «از درون کد» را رد کنید.", en: "Disk replacement, host maintenance, maintenance flags, the autoscaler and the balancer. On a first pass skip the \"Inside the code\" sections."}
          - ref: lab:capacity
            min: 15
            why: {fa: "ببینید MAX AVAIL را کدام OSD تعیین می‌کند و با از دست رفتن یک میزبان چه OSDهایی به nearfull و full می‌رسند.", en: "See which OSD sets MAX AVAIL and which OSDs reach nearfull and full when a host is lost."}
      - title: {fa: "دیدن مشکل پیش از وقوع", en: "Seeing trouble coming"}
        steps:
          - ref: ch20
            hands_on: 20
            why: {fa: "Prometheus، سیگنال‌های کلیدی، طراحی هشدار و داشبورد. هشدار خوب نصف عیب‌یابی است.", en: "Prometheus, the key signals, alert design and dashboards. A good alert is half the troubleshooting."}
      - title: {fa: "وقتی چیزی خراب می‌شود", en: "When something breaks"}
        steps:
          - ref: ch17
            hands_on: 30
            why: {fa: "روش عیب‌یابی، مشکل MON و OSD، وضعیت‌های PG، slow ops و ابزارهای خطرناک. بخش «از درون کد» را در بار اول رد کنید.", en: "The troubleshooting method, MON and OSD problems, PG states, slow ops and the dangerous tools. Skip the code-level sections on a first pass."}
          - ref: appC
            why: {fa: "جدول نشانه به اقدام: وقتی حادثه است از همین‌جا شروع کنید.", en: "The symptom-to-action table: start here during an incident."}
          - ref: lab:quorum
            min: 10
            why: {fa: "شبکه را دو نیم کنید و ببینید کدام طرف quorum دارد.", en: "Split the network and see which side keeps quorum."}
          - ref: sec-18-2
            why: {fa: "لایه‌های دفاعی: از کپی در کلاستر تا نسخه‌ی پشتیبان مستقل.", en: "The layers of defence, from copies inside the cluster to an independent backup."}
          - ref: sec-18-8
            hands_on: 15
            why: {fa: "اگر همه‌ی MONها از دست رفتند: پیشگیری و بازسازی از روی OSDها.", en: "If every MON is lost: prevention and rebuilding from the OSDs."}
          - ref: sec-18-10
            why: {fa: "پشتیبان مستقل از کلاستر، تا یک حادثه‌ی منطقی همه‌چیز را با هم نبرد.", en: "A backup independent of the cluster, so one logical accident cannot take everything."}
          - ref: appL
            hands_on: 30
            why: {fa: "اگر یک سایت از دست رفت: پایش همگام‌سازی، switchover، failover و failback، و چک‌لیست تمرین DR.", en: "If a site is lost: monitoring sync, switchover, failover and failback, and a DR drill checklist."}
      - title: {fa: "ارتقا و تنظیم", en: "Upgrading and tuning"}
        steps:
          - ref: appJ
            hands_on: 30
            why: {fa: "راهنمای گام‌به‌گام ارتقا از Reef به Squid و Tentacle، با چک‌لیست و گام‌های بی‌بازگشت.", en: "The step-by-step upgrade guide from Reef to Squid and Tentacle, with a checklist and the one-way steps."}
          - ref: sec-21-2
            why: {fa: "روش و لایه‌ها: پیش از دست بردن در تنظیمات، بسنجید و سپس عوض کنید.", en: "Method and layers: measure before you touch a setting, then change one thing at a time."}
          - ref: lab:mclock
            min: 15
            why: {fa: "ببینید یک OSD ظرفیتش را بین کلاینت، recovery و کارهای پس‌زمینه چطور تقسیم می‌کند.", en: "See how one OSD splits its capacity between clients, recovery and background work."}
          - ref: lab:scrub
            optional: true
            min: 10
            why: {fa: "زمان‌بندی scrub و اثر پنجره‌ی شبانه.", en: "How scrubs are scheduled and what the night window does."}
          - ref: appB
            optional: true
            min: 20
            why: {fa: "برگه‌ی دستورها، برای یافتن سریع دستور و هشدارهای دستورهای خطرناک.", en: "The cheat sheet, to find a command fast and to see which ones are dangerous."}

  - id: s3dev
    icon: code
    short: {fa: "توسعه‌دهنده‌ی S3", en: "S3 developer"}
    title: {fa: "برنامه‌ای روی S3 و RGW می‌نویسم", en: "I build applications on S3 and RGW"}
    who:
      fa: "برنامه‌نویس یا مهندس پلتفرمی که سرویسی روی API سازگار با S3 می‌سازد و باید رفتار RGW را زیر بار، هنگام خطا و در چند سایت بداند."
      en: "A developer or platform engineer building a service on the S3-compatible API who needs to know how RGW behaves under load, on failure and across sites."
    prereq:
      fa: "با S3 کار کرده‌اید (bucket، شیء، aws-cli یا یک SDK). دانش قبلی از Ceph لازم نیست؛ اگر خواستید، گام نخست را بخوانید."
      en: "You have used S3 (buckets, objects, aws-cli or an SDK). No Ceph knowledge is needed; read the first step if you want the background."
    outcomes:
      fa:
        - "کاربر، کلید و سهمیه‌ی RGW می‌سازید و با aws-cli یا یک SDK به آن وصل می‌شوید."
        - "نسخه‌بندی، Object Lock، lifecycle و سیاست bucket را درست به کار می‌برید."
        - "می‌دانید چرا یک bucket بزرگ لیست‌گیری کند می‌شود و کلیدها را چطور طراحی کنید."
        - "امضای SigV4، رمزنگاری سمت سرور و STS را می‌فهمید و خطای احراز هویت را عیب‌یابی می‌کنید."
        - "رفتار برنامه‌تان را هنگام failover بین سایت‌ها پیش‌بینی می‌کنید."
      en:
        - "You create RGW users, keys and quotas and connect with aws-cli or an SDK."
        - "You use versioning, Object Lock, lifecycle and bucket policy correctly."
        - "You know why a large bucket gets slow to list and how to design keys."
        - "You understand SigV4, server-side encryption and STS, and can debug an authentication error."
        - "You can predict how your application behaves when sites fail over."
    next: [architect, sre]
    stages:
      - title: {fa: "آشنایی با RGW", en: "Meeting RGW"}
        steps:
          - ref: sec-01-4
            optional: true
            why: {fa: "اگر Ceph را نمی‌شناسید: نقشه‌ی ذهنی RADOS، pool و PG که RGW روی آن ساخته شده است.", en: "If Ceph is new to you: the mental map of RADOS, pools and PGs that RGW is built on."}
          - ref: sec-04-2
