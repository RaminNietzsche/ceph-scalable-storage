      en: "A C++ developer who wants to follow a request from librados to disk, find the cause of a behaviour in the code, or send a patch to Ceph."
    prereq:
      fa: "C++ و برنامه‌نویسی سیستمی لینوکس، و شناخت اپراتوری از Ceph (مسیر «تازه‌وارد»). یک کلاستر آزمایشی یا کلاستر vstart برای تمرین‌ها."
      en: "C++ and Linux systems programming, and an operator's knowledge of Ceph (the newcomer path). A test cluster or a vstart cluster for the exercises."
    outcomes:
      fa:
        - "نقشه‌ی مخزن، کلاس‌های اصلی و مدل threadها را می‌شناسید."
        - "مسیر کامل نوشتن در RADOS را تابع‌به‌تابع دنبال می‌کنید."
        - "peering، لاگ PG و recovery را در کد می‌خوانید."
        - "قالب روی دیسک BlueStore و RocksDB را بایت‌به‌بایت می‌خوانید."
        - "محاسبه‌ی CRUSH را تا سطح بیت دنبال می‌کنید."
      en:
        - "You know the repository map, the main classes and the thread model."
        - "You follow a complete RADOS write, function by function."
        - "You read peering, the PG log and recovery in the code."
        - "You read the BlueStore and RocksDB on-disk formats byte by byte."
        - "You follow the CRUSH computation down to the bit."
    next: [sre]
    stages:
      - title: {fa: "جهت‌یابی", en: "Getting oriented"}
        steps:
          - ref: ch22
            hands_on: 45
            why: {fa: "نقشه‌ی مخزن، ساخت و محیط توسعه، کلاس‌های اصلی، مدل thread و مسیر کامل یک نوشتن.", en: "The repository map, build and development environment, the main classes, the thread model and a full write path."}
          - ref: sec-08-6
            why: {fa: "از درون کد: جایگذاری، احراز هویت و پیام‌رسانی.", en: "Inside the code: placement, authentication and messaging."}
          - ref: appM
            optional: true
            why: {fa: "هر دستور و گزینه‌ی خط فرمان با خط سورس آن؛ موارد مستندنشده و کهنه جای خوبی برای نخستین وصله به کد یا مستندات‌اند.", en: "Every command-line command and option with its source line; the undocumented and stale ones are a good place for a first patch to the code or the docs."}
      - title: {fa: "هسته‌ی RADOS", en: "The RADOS core"}
        steps:
          - ref: ch34
            hands_on: 15
            why: {fa: "هویت شیء، فراداده‌ی هر شیء و مسیر op درون OSD.", en: "Object identity, per-object metadata and the op path inside the OSD."}
          - ref: ch35
            hands_on: 15
            why: {fa: "لاگ PG، بازه‌ها، مجموعه‌های missing و این‌که recovery و backfill چطور کار می‌کنند.", en: "The PG log, intervals, missing sets and how recovery and backfill work."}
          - ref: lab:peering
            min: 15
            why: {fa: "سه داستان از یک PG را گام‌به‌گام دنبال کنید و ماشین حالت peering را ببینید.", en: "Step through three stories of one PG and watch the peering state machine."}
          - ref: ch36
            optional: true
            why: {fa: "snapshot و clone، watch/notify و کلاس‌های cls سمت OSD.", en: "Snapshots and clones, watch/notify and OSD-side cls."}
      - title: {fa: "موتور ذخیره‌سازی", en: "The storage engine"}
        steps:
          - ref: sec-12-7
            why: {fa: "از درون کد: BlueStore.", en: "Inside the code: BlueStore."}
          - ref: ch24
            why: {fa: "قالب روی دیسک BlueStore و BlueFS.", en: "The BlueStore and BlueFS on-disk format."}
          - ref: ch25
            why: {fa: "RocksDB درون BlueStore: WAL، memtable، SST و compaction.", en: "RocksDB inside BlueStore: the WAL, memtable, SSTs and compaction."}
      - title: {fa: "جایگذاری و شبکه", en: "Placement and the network"}
        steps:
          - ref: ch28
            why: {fa: "CRUSH در سطح بیت: از rjenkins تا upmap.", en: "CRUSH at the bit level, from rjenkins to upmap."}
          - ref: lab:crush
            min: 15
            why: {fa: "همان قاعده‌ها را روی یک درخت بسازید و جابه‌جایی PGها را ببینید.", en: "Build the same rules on a tree and watch the PGs move."}
          - ref: ch26
            optional: true
            why: {fa: "msgr2 در سطح بایت.", en: "msgr2 at the byte level."}
          - ref: ch33
            optional: true
            why: {fa: "حافظه و CPU درون OSD.", en: "Memory and CPU inside the OSD."}
          - ref: ch30
            optional: true
            why: {fa: "Crimson و Seastar: OSD نسل بعد.", en: "Crimson and Seastar: the next-generation OSD."}
