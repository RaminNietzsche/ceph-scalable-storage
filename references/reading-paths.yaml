          - ref: sec-11-4
            why: {fa: "اگر Ceph را بیرون Kubernetes اجرا می‌کنید: استقرار اعلانی با cephadm.", en: "If you run Ceph outside Kubernetes: declarative deployment with cephadm."}
          - ref: sec-11-6
            why: {fa: "از آزمایشگاه تا تولید: چک‌لیست پیش از استقرار و کارهای پس از bootstrap.", en: "From lab to production: the pre-deployment checklist and the work after bootstrap."}
          - ref: sec-11-10
            optional: true
            why: {fa: "مدیریت تغییر و GitOps برای ذخیره‌سازی.", en: "Change management and GitOps for storage."}
