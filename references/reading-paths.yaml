# Suggested reading paths: the single data source.
#
# Rendered as the web page paths.html (with the on-page "next step" hint), as the table in the preface of the
# print book, and checked by tools/check_paths.py (make check-paths): every ref exists in both editions, fa and
# en have the same shape, the text follows the prose rules.
#
# A step names one thing to read or do by `ref`:
#   chN         a whole chapter                   ch7
#   sec-NN-K    a section (or sub-section)        sec-07-6
#   appX        an appendix, by its print id      appJ   (A glossary, B cheat sheet, C troubleshooting, D release
#                                                 table, F answers, G bibliography, H algorithms, I changes,
#                                                 J upgrade guide, K RGW security, L multisite and DR,
#                                                 M command-line reference)
#   lab:NAME    an interactive lab of the site    lab:balancer
# `optional: true` marks a step that can be skipped; `why` says what the reader gets from it; `hands_on` adds the
# minutes a step needs for its exercises.
# Reading time comes from the text itself; `min` is needed only for labs and for appendices that have no
# Markdown source (A, B, E, F, G, H, I).

version: 1
preface_cols:
  fa: ["خواننده", "ترتیب پیشنهادی", "زمان تقریبی"]
  en: ["Reader", "Suggested order", "Estimated time"]

