back_title: درباره‌ی این کتاب
back_body_html: 'این راهنمای مفصل فارسی در بیست‌ویک فصل، یک بخش ویژه، یازده فصل «لایه‌های پایینی» و نه فصل «بخش تخصصی»، Ceph را از معماری RADOS و الگوریتم CRUSH تا اجرای عملیاتی کلاسترهای بزرگ، و از آنجا تا بایت‌های روی دیسک و قاب‌های شبکه، بررسی می‌کند. هر فصل علاوه بر توضیح و دستورهای عملی، بخش «از درون کد» دارد که ساختارها، الگوریتم‌ها و مسیر توابع را با نمودارهای اختصاصی و شبه‌کد نشان می‌دهد. کتاب ده‌ها الگوریتم کد Ceph را با مثال عددی کارشده و شکل باز می‌کند.

  <ul><li>RBD، RGW و multisite، CephFS و OpenStack</li><li>BlueStore، erasure coding، librados و کلاس‌های RADOS</li><li>cephadm، پایش، عیب‌یابی، بازیابی از فاجعه و تنظیم کارایی</li><li>معماری کد Ceph و مسیر کامل درخواست‌ها</li><li>لایه‌های پایینی: BlueStore و RocksDB روی دیسک، msgr2، ریاضیات EC، CRUSH در سطح بیت و کلاینت‌های هسته</li><li>Crimson و SeaStore، SPDK و NVMe-oF، scrub و recovery، حافظه و CPU درون OSD</li><li>بخش تخصصی: مسیر op و pg log در RADOS، چیدمان و I/O و mirroring در RBD، ایندکس، gc، lifecycle و multisite در RGW</li></ul>

  همراه با واژه‌نامه، برگه‌ی تقلب دستورها، راهنمای عیب‌یابی، پاسخ پرسش‌ها، فهرست الگوریتم‌ها، کتاب‌نامه و نمایه.'
