back_title: "About this book"
back_body_html: |
  In twenty-one chapters, a special part and eleven “lower layers” chapters, this guide takes Ceph from the RADOS architecture and the CRUSH algorithm to running large clusters in production, and from there down to the bytes on disk and the frames on the wire. Besides explanations and hands-on commands, every chapter has a “from the code” section that shows data structures, algorithms and call paths with purpose-made diagrams and pseudocode. Version 1.4 opens up dozens of Ceph algorithms with worked numeric examples and figures.
  <ul><li>RBD, RGW and multisite, CephFS and OpenStack</li><li>BlueStore, erasure coding, librados and RADOS classes</li><li>cephadm, monitoring, troubleshooting, disaster recovery and performance tuning</li><li>Ceph's code architecture and the full request path</li><li>Lower layers: BlueStore and RocksDB on disk, msgr2, EC math, CRUSH at the bit level and the kernel clients</li><li>Crimson and SeaStore, SPDK and NVMe-oF, scrub and recovery, memory and CPU inside the OSD</li></ul>
  With a glossary, command cheat sheet, troubleshooting guide, answers to review questions, list of algorithms, bibliography and index.
back_note_html: "This work is an independent study guide organised after the table of contents of <span class=\"en\">Ceph: Designing and Implementing Scalable Storage Systems (Umrao, Singh, Fisk, D'Atri, Bhembre, 2019)</span> and is not a translation of it. The English edition is a translation of the author's original Persian text. All rights to the original book remain with its authors and publisher. For personal and educational use."
