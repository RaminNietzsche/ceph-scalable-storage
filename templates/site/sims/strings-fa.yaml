pl_rbd_s1_n: "librbd بازه را به Striper می‌سپارد (Striper::file_to_extents). image به تکه‌هایی به اندازهٔ stripe_unit بریده می‌شود که به نوبت میان stripe_count شیء پخش می‌شوند؛ وقتی این شیءها پر شدند، دستهٔ بعدی شیءها آغاز می‌شود. هر شیء تنها یک extent از بایت‌های خودش می‌گیرد و بازه‌هایی از image که آن را پر می‌کنند کنارش آمده است. با stripe_count برابر ۱ (پیش‌فرض)، stripe_unit همان اندازهٔ شیء است و image به سادگی به شیءهای پشت‌سرهم بریده می‌شود."
pl_rbd_s2_t: هر شیء داده تا PG و OSDهایش
pl_rbd_s2_n: "هر شیء داده یک شیء معمولی RADOS در pool {pool} است و همان پنج گامِ یک شیء تنها را طی می‌کند: hash نام، PG، pps، CRUSH و مجموعهٔ up. با دکمهٔ «گام‌ها» می‌توانید این گام‌ها را برای یک شیء باز کنید."
pl_rbd_s2_dp: "با --data-pool شیءهای داده در pool {pool} نگه داشته می‌شوند و در نامشان شناسهٔ pool فراداده ({md}) هم می‌آید؛ همان پنج گام را طی می‌کنند، این بار با شناسهٔ pool داده و pg_num آن. با دکمهٔ «گام‌ها» می‌توانید این گام‌ها را برای یک شیء باز کنید."
pl_rbd_s3_t: شیءهای فرادادهٔ image
pl_rbd_s3_n: "هر image با فرمت ۲ این شیءها را در pool {md} دارد، حتی وقتی pool داده جداست: rbd_directory نام و شناسهٔ همهٔ imageهای pool را به هم نگاشت می‌کند؛ rbd_id.<name> شناسهٔ image را نگه می‌دارد؛ rbd_header.<id> اندازه، order، featureها، snapshotها و watcherها را (بیشتر در omap) نگه می‌دارد؛ و وقتی قابلیت object-map روشن است (پیش‌فرض)، rbd_object_map.<id> برای هر شیء داده دو بیت دارد. این شیءها درست مثل شیءهای داده جای‌گذاری می‌شوند."
pl_rbd_s4_t: کل image
pl_rbd_s4_n: "همهٔ شیءهای image، با این فرض که همه نوشته شده‌اند؛ در واقع RBD فضا را thin-provisioned می‌گیرد و هر شیء تنها وقتی ساخته می‌شود که چیزی در آن نوشته شود. جدول نشان می‌دهد هر OSD چند نسخه از این شیءها را نگه می‌دارد و primary چندتای آن‌هاست."
