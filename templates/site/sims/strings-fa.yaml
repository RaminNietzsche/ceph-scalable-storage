ecprofile_t: Replication یا erasure coding
ecprofile_d: k، m و plugin را انتخاب کنید و ظرفیت قابل‌استفاده، سربار، خرابی‌های قابل‌تحمل و هزینهٔ بازسازی یک chunk را مقایسه کنید.
ecprofile_what: "EC روی k+m OSD، k chunk داده و m chunk کد نگه می‌دارد (LRC برای هر گروه l تایی یک chunk محلی هم اضافه می‌کند). monitor مقدار min_size را k + min(1, m − 1) می‌گذارد؛ پس pool EC با از دست رفتن یک chunk همچنان I/O می‌دهد ولی پیش از آن‌که بدون افزونگی کار کند می‌ایستد؛ pool تکراری size − ⌊size/2⌋ می‌گیرد. هزینهٔ بازسازی یعنی چند chunk باید خوانده شود تا یکی ساخته شود: k برای Reed-Solomon (isa و jerasure)، l برای LRC و d/(d−k+1) معادل chunk برای CLAY."
ecprofile_limit: "ظرفیت، metadata ی BlueStore، پرشدگی min_alloc در شیءهای کوچک و حاشیهٔ ۸۵٪ nearfull را در نظر نمی‌گیرد (این آخری جداگانه با عنوان «عملی» آمده). عدد بازسازی SHEC تقریب کتاب است."
ec_hosts: تعداد host
ec_per: OSD در هر host
ec_tb: اندازهٔ هر OSD (TB)
ec_rep: مقایسه با تکرار
ec_raw: ظرفیت خام
ec_domains: failure domainها
ec_usable: قابل‌استفاده
ec_practical: تا nearfull (۸۵٪)
ec_overhead: بایت خام به ازای هر بایت مفید
ec_tol: از دست رفتن OSD/host بدون از دست رفتن داده
ec_io: از دست رفتن با ادامهٔ I/O
ec_repair: خواندن برای بازسازی یک chunk
ec_chunks: chunk
ec_repl: "تکراری، size برابر {n}"
ec_note: "profile پیش‌فرض در main برابر plugin=isa technique=reed_sol_van k=2 m=2 است؛ profile را پس از آن‌که poolی از آن استفاده کرد نمی‌توان تغییر داد."
ec_e_lrc1: "LRC: مقدار k + m باید مضربی از l باشد."
ec_e_lrc2: "LRC: مقدار k باید مضربی از (k + m) / l باشد."
ec_e_lrc3: "LRC: مقدار m باید مضربی از (k + m) / l باشد."
ec_e_shec: "SHEC: مقدار c نباید از m بیشتر باشد."
ec_e_clay: "CLAY به m ≥ 2 نیاز دارد تا d بین k + 1 و k + m − 1 قرار بگیرد."
ec_e_fd: "{n} chunk ولی فقط {d} failure domain: PGها active نمی‌شوند."
ec_w_fd: "تعداد chunkها برابر failure domainهاست: پس از خرابی یک domain جایی برای بازیابی نمی‌ماند."
r_ec_minsize: size و min_size یک pool تازه
r_ec_def: profile پیش‌فرض و نسبت‌های پرشدگی
r_ec_lrc: قاعده‌های k، m و l در LRC
r_ec_clay: بازهٔ d در CLAY
r_ec_shec: قاعدهٔ c در SHEC
r_as_passes: چهار گذر روی poolهای یک root
r_as_knap: گرد کردن گروه‌های pool درون بودجه
r_as_pow2: توان ۲ و آستانهٔ تغییر
