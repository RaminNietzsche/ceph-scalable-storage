rgwput_t: PUT و multipart در RGW
rgwput_d: یک کلید و اندازه بدهید و یک PUT ی S3 را از radosgw تا bucket index و data pool، همراه با شیءهای RADOS که می‌سازد، دنبال کنید.
rgwput_what: "stripeهای دُم هم‌زمان با رسیدن بدنه نوشته می‌شوند؛ تنها پس از آن shard ی bucket index آماده می‌شود (cls rgw_bucket_prepare_op)، شیء head همراه manifest و attributeها نوشته می‌شود و ورودی index کامل می‌شود (rgw_bucket_complete_op که bucket index log را هم می‌نویسد). shard برابر ceph_str_hash_linux کلید است که تا خورده و به پیمانهٔ یک عدد اول و تعداد shardها گرفته می‌شود. بارگذاری multipart هر part را در شیءهای خودش می‌نویسد و complete پایانی تنها یک head با manifest ی می‌نویسد که partها را فهرست می‌کند."
rgwput_limit: "یک zone، بدون versioning، رمزنگاری، فشرده‌سازی و object lock؛ در نام شیءها MARKER جای bucket marker و جای‌نگهدارها جای بخش‌های تصادفی آمده است. شمارهٔ shardها دقیق است."
