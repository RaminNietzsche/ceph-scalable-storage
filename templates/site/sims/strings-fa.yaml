pl_s3_n: "با پرچم hashpspool (پیش‌فرض)، شمارهٔ PG یک بار دیگر با pgp_num کوچک می‌شود و بعد با شناسهٔ pool درهم می‌شود تا PGهای هم‌شمارهٔ poolهای مختلف روی OSDهای یکسان نیفتند."
pl_s4_t: "CRUSH: یک قرعه در هر bucket"
pl_s4_n: "قاعده از root شروع می‌کند و برای هر نسخه یک {fd} و یک OSD زیر آن برمی‌گزیند. r شمارهٔ تلاش است، r = شمارهٔ نسخه + ftotal: هر بار که انتخابی رد یا تکراری شود، r یکی بالا می‌رود و قرعه از نو کشیده می‌شود. سطر برندهٔ هر جدول برجسته شده است."
pl_s5_t: مجموعهٔ up، مجموعهٔ acting و primary
pl_s5_n: "CRUSH مجموعهٔ خام را برمی‌گرداند و OSDMap از آن OSDهای down را کنار می‌گذارد (مجموعهٔ up). بدون pg_temp و upmap، مجموعهٔ acting همان up است و نخستین عضو آن primary است."
