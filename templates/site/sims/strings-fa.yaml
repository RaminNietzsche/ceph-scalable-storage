# ---- lab scrub ----
scrub_t: "زمان‌بند scrub: تصادف و پنجره‌ی شبانه"
scrub_d: "زمان scrub یک گروه PG را رسم کنید و ببینید پنجره‌ی ساعت کاری چقدر آن را عقب می‌اندازد؛ توزیع یکنواخت shallow را با توزیع نرمال بریده‌شده‌ی deep مقایسه کنید."
scrub_what: "shallow در بازه‌ی interval تا interval × (1+ratio) پخش می‌شود. deep از نرمال با انحراف معیار interval × CV می‌آید و در دو انحراف معیار بریده می‌شود؛ با CV=0.2 بازه ۰٫۶ تا ۱٫۴ برابر interval است. پنجره‌ی ساعت نیمه‌باز است، از نیمه‌شب می‌تواند بگذرد و آغاز برابر پایان یعنی تمام روز."
scrub_limit: "همه‌ی PGها در مبدأ آخرین scrub را تمام کرده‌اند. این نمودار فقط زمان هدف و نخستین ساعت مجاز را نشان می‌دهد، نه زمان اجرای واقعی: هم‌زمانی، reservationهای replica، بار CPU، backoff تصادفی، recovery و mClock هم ممکن است کار را عقب بیندازند. مولد تصادفی برای تکرارپذیری آموزشی است، نه مولد Ceph."
