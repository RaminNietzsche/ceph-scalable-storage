pl_cmp_note: "«کمترین مقدار لازم» جابه‌جایی‌ای است که یک جای‌گذاری بی‌نقص برای رسیدن به سهم تازهٔ هر OSD لازم دارد: جمع آنچه هر OSD به دست می‌آورد. هیچ جای‌گذاری سلسله‌مراتبی دقیقاً به آن نمی‌رسد، چون اشیایی که به یک host وارد یا از آن خارج می‌شوند درون آن host دوباره قرعه می‌خورند، و با چند نسخه، hostی که جایگاه زودتری را می‌برد بقیه را یک خانه جلو می‌راند. تفاوت الگوریتم‌ها در باقی ماجراست (نارنجی): straw2 هرگز داده را میان دو آیتمی که وزنشان عوض نشده جابه‌جا نمی‌کند؛ uniform با بزرگ یا کوچک شدن bucket همه‌چیز را از نو قرعه می‌کشد (افزودن host) و وزن را نمی‌بیند؛ list و tree به جای آیتم بستگی دارند (حذف host دوم، یا OSDی در میانهٔ یک host). out کردن یک OSD با هر پنج الگوریتم یک هزینه دارد، چون CRUSH فقط آن را رد می‌کند و دوباره قرعه می‌کشد."
pl_cmp_note_alg: "تبدیل bucketها قرعه‌ها را عوض می‌کند و اندازهٔ جابه‌جایی به جفت الگوریتم‌ها بستگی دارد. وقتی وزن‌های درون یک bucket برابرند، تبدیل straw به straw2 دادهٔ کمی جابه‌جا می‌کند، چون هر دو بزرگ‌ترین hash را برمی‌گزینند (برای همین ceph osd crush set-all-straw-buckets-to-straw2 کم‌هزینه است)؛ با وزن‌های ناهمسان، یا در تبدیل به uniform، list و tree و برعکس، بیشتر داده جابه‌جا می‌شود."
