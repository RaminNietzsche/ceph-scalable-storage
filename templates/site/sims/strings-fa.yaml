pgcalc_t: ماشین‌حساب تعداد PG
pgcalc_d: "تعداد OSDها و سهم هر pool از داده را بدهید: پاسخ pgcalc کلاسیک و انتخاب pg_autoscaler را گذر به گذر ببینید."
pgcalc_what: "بخش autoscaler برگردان module.py در شاخهٔ main خود Ceph است: بودجهٔ root برابر mon_target_pg_per_osd × تعداد OSD است؛ اول poolهایی که autoscale ندارند، بعد poolهای غیر bulk، بعد poolهای bulk که بیش از سهم برابر نیاز دارند و در آخر بقیه به‌طور برابر. در هر گذر یک knapsack هر گروه از poolها را درون بودجهٔ باقی‌مانده به توان ۲ بالاتر یا پایین‌تر گرد می‌کند. تغییر فقط وقتی پیشنهاد می‌شود که از آستانه بگذرد (۳ برابر؛ ۱ برابر نزدیک ۵۱۲ و ۱۰۲۴، ۲ برابر نزدیک ۲۰۴۸)."
pgcalc_limit: "یک CRUSH root، سهم به‌صورت capacity_ratio (target_size_ratio)، bias برابر ۱ و بدون pg_num_max. برای حالت‌های آزمون، خروجی با module.py واقعی یکی است."
