bluestore_t: مسیر نوشتن BlueStore
bluestore_d: دستگاه، offset و طول یک نوشتن را انتخاب کنید و ببینید BlueStore چطور آن را تکه می‌کند و تصمیم می‌گیرد چه چیزی از WAL (deferred) و چه چیزی مستقیم نوشته شود.
bluestore_what: "این مسیر کلاسیک نوشتن است (bluestore_write_v2 به‌طور پیش‌فرض false است). _do_write_data نوشتن را در مرز min_alloc_size به سرِ ناهم‌تراز، میانهٔ هم‌تراز و دُمِ ناهم‌تراز می‌بُرد. بازنویسی فضایی که از پیش تخصیص یافته، نوشتن deferred می‌شود: در تراکنش RocksDB می‌رود، پس از commit تأیید می‌شود و بعداً سر جایش کپی می‌شود. دادهٔ تازه به فضای تازه‌تخصیص‌یافته می‌رود؛ اگر کل دادهٔ تازهٔ این نوشتن کوچک‌تر از prefer_deferred_size باشد آن هم deferred می‌شود و گرنه پیش از commit با aio نوشته می‌شود."
bluestore_limit: "بدون فشرده‌سازی، checksum، استفادهٔ دوباره از blob و garbage collection؛ فرض شده هر ناحیه یک blob تغییرپذیر دارد. قاعده‌های تصمیم و حالت‌های تراکنش مطابق BlueStore.cc است."
