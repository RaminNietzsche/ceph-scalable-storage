pl_ecc_n: "در pool از نوع replicated نسخه‌ای جابه‌جا شده است که OSD تازه‌اش پیش‌تر در مجموعه نبوده؛ در pool از نوع erasure-coded هر shard که OSD جایگاهش عوض شود جابه‌جا شده است، چون هر جایگاه تکهٔ متفاوتی دارد. ردیف سوم نشان می‌دهد اگر Ceph در این poolها firstn را به کار می‌برد، چند shard بیشتر جابه‌جا می‌شد. هر shard تنها 1/k اندازهٔ شیء است، پس ستون آخر حجم دادهٔ منتقل‌شده به ازای هر شیء را بر حسب اندازهٔ شیء نشان می‌دهد؛ ساختن هر shard در جای تازه به خواندن k shard دیگر هم نیاز دارد."
