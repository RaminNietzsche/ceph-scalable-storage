crush_t: زمین بازی CRUSH
crush_d: یک root، چند host و OSD بسازید، قاعده را انتخاب کنید و ببینید straw2 هر PG را کجا می‌گذارد؛ یک OSD را out یا down کنید یا وزنش را تغییر دهید و ببینید کدام PGها جابه‌جا می‌شوند.
crush_what: "بذر هر PG (pps) همان‌طور که Ceph حساب می‌کند به دست می‌آید و سپس crush_do_rule روی نقشه‌ای با tunables نسخهٔ jewel اجرا می‌شود: یک root از نوع straw2 با hostهای straw2 و همان قاعده‌ای که ceph osd pool create می‌سازد (chooseleaf firstn برای replicated و chooseleaf indep برای EC، با host یا osd به‌عنوان failure domain). «out» مقدار reweight آن OSD را صفر می‌کند (CRUSH از آن می‌گذرد)؛ «down» آن را در نقشه نگه می‌دارد ولی از مجموعهٔ up حذف می‌کند. ستون‌ها تعداد shardهای PG روی هر OSD است و خط نازک سهمی است که وزنش به آن می‌دهد."
crush_limit: "بدون pg_temp، upmap، primary affinity و device class؛ وزن هر OSD اندازهٔ آن به TiB است. برای این نقشه‌ها خروجی دقیقاً با کد C خود Ceph یکی است (tests/sims/golden.json)."
