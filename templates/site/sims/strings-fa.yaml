striping_t: نگاشت striping در RBD
striping_d: "اندازهٔ شیء، stripe_unit و stripe_count یک image و offset و طول یک I/O را تعیین کنید: ببینید به کدام شیءهای rbd_data و کجای آن‌ها دست می‌زند."
striping_what: "librbd هر I/O را به Striper می‌سپارد. image به تکه‌هایی به اندازهٔ stripe_unit بریده می‌شود که به نوبت میان stripe_count شیء پخش می‌شوند؛ وقتی آن شیءها پر شدند، مجموعهٔ بعدی شیءها آغاز می‌شود. نام هر شیء rbd_data.<id>. و شمارهٔ آن در ۱۶ رقم hex است. با stripe_count برابر ۱ (پیش‌فرض) stripe_unit همان اندازهٔ شیء است و image به سادگی به شیءهای پشت‌سرهم بریده می‌شود."
striping_limit: "تنها شیءهای داده؛ شیءهای header، id و object-map نشان داده نمی‌شوند (آزمایشگاه «از نام شیء تا OSD» در حالت RBD آن‌ها را نشان می‌دهد). extentها دقیقاً همان چیزی است که Striper::file_to_extents برمی‌گرداند (با کد Striper خود Ceph و بردارهای آزمون آن بررسی شده)."
