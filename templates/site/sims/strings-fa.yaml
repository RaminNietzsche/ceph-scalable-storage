# ---- lab ecdecode ----
ecdecode_t: "کدگذاری پاک‌سازی: شکستن، از دست دادن، بازسازی"
ecdecode_d: "یک متن را به k تکه‌ی داده و m تکه‌ی توازن بشکنید، هر shard را که خواستید از کار بیندازید و ببینید کدام تکه‌ها خوانده می‌شوند و متن چطور با وارون ماتریس در GF(2⁸) برمی‌گردد."
ecdecode_what: "هر بایت توازن جمع (XOR) ضرب‌های ضریب‌های ماتریس کدگذاری در بایت‌های داده در میدان GF(2⁸) با چندجمله‌ای 0x11d است. ماتریس همان است که jerasure (reed_sol_vandermonde_coding_matrix) یا ISA-L (gf_gen_rs_matrix) برای technique=reed_sol_van می‌سازد. برای خواندن، اگر همه‌ی تکه‌های داده سالم باشند فقط همان‌ها خوانده می‌شوند؛ وگرنه k تکه‌ی اول در دسترس انتخاب و ردیف‌هایشان وارون می‌شود (ErasureCode::_minimum_to_decode)."
ecdecode_limit: "یک stripe و یک شیء کوچک؛ اندازه‌ی تکه همان طول متن تقسیم بر k است و تراز stripe_unit، فشرده‌سازی و کدگذاری جزئی (EC optimizations) نشان داده نمی‌شود. ماتریس‌ها و توازن با کد C خود jerasure و ISA-L بررسی شده‌اند."
ecdecode_r1: "ماتریس کدگذاری jerasure"
ecdecode_r2: "ماتریس و کدگذاری ISA-L"
