mclock_ph_wgt: "shard پر است: هر کلاس دست‌کم reservation خود را می‌گیرد و باقی به نسبت weight پخش می‌شود، تا سقف limit و تقاضای خودش."
mclock_ph_idle: "تقاضا از ظرفیت کمتر است و همه‌ی کلاس‌ها کامل سرویس می‌گیرند (جز آنچه limit بسته است)؛ پروفایل فقط وقتی اثر دارد که دیسک پر باشد."
mclock_note: "IOPS را با عدد واقعی دیسک خود (نتیجه‌ی osd bench) عوض کنید: اگر خیلی بالا باشد cost_per_io کوچک می‌شود، mClock عملیات کوچک را ارزان می‌پندارد و سهم‌ها دیگر از کلاینت محافظت نمی‌کنند. برای تند کردن بازیابی پس از خرابی، پروفایل high_recovery_ops را موقتاً بگذارید و بعد برگردانید (فصل ۷)."
