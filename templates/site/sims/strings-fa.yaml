# ---- lab mdspin ----
mdspin_t: "زیردرخت‌های CephFS و pin کردن روی MDS"
mdspin_d: "درخت /home، /projects و /scratch را بین rankهای MDS تقسیم کنید: pin صریح و ارث آن، pin توزیع‌شده‌ی ephemeral و pin تصادفی را عوض کنید و ببینید max_mds کدام زیردرخت‌ها را جابه‌جا می‌کند."
mdspin_what: "CInode::get_export_pin از inode به سوی ریشه می‌رود و نزدیک‌ترین سیاست را اعمال می‌کند: pin صریح همان rank را می‌دهد؛ pin توزیع‌شده، دایرکتوری والد را به 2^bits dirfrag تقسیم می‌کند (bits تا factor × max_mds می‌رسد) و هر frag را با MDCache::hash_into_rank_bucket روی یک rank می‌گذارد؛ pin تصادفی با احتمال min(ceph.dir.pin.random, mds_export_ephemeral_random_max) یک زیردرخت را برمی‌گزیند و آن را با همان تابع هش می‌کند. تابع rank از rjhash64 و jump consistent hash استفاده می‌کند؛ نام dentry با ceph_str_hash_rjenkins (پیش‌فرض) مشخص می‌کند فرزند در کدام dirfrag والد می‌نشیند. همه‌ی این محاسبات از کد Ceph برگردانده شده‌اند."
mdspin_limit: "درخت نمونه کوچک است (inodeها از 0x10000000000 شروع می‌شوند)، dirfragها به یک اندازه تقسیم شده‌اند و balancer خودکار بار خاموش فرض شده است؛ subtreeی که pin ندارد با والدش روی rank صفر می‌ماند. draw تصادفی برای هر inode ثابت است تا بازسازی صفحه آن را عوض نکند؛ در Ceph هنگام بارگذاری inode عدد تصادفی تازه گرفته می‌شود. pin به rankی بزرگ‌تر یا مساوی max_mds جابه‌جایی نمی‌دهد تا آن rank ساخته شود. برای موارد آزمون، هش‌ها و dirfrag و rank با کد خود Ceph یکسان‌اند (tests/sims/golden-labs.json)."
