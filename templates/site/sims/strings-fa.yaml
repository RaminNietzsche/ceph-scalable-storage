# ---- lab reshard ----
reshard_t: "شاردهای نمایه‌ی bucket و reshard پویا"
reshard_d: "bucket را تا چند میلیون شیء بزرگ کنید و ببینید reshard پویا کِی و به چند شارد آن را تقسیم می‌کند، کلیدها چطور بین شاردها پخش می‌شوند و یک صفحه‌ی فهرست مرتب از چند شارد چند ورودی می‌خواند."
reshard_what: "هر بار که bucket از «شاردها × rgw_max_objs_per_shard» رد می‌شود، check_bucket_shards آن را در صف reshard می‌گذارد و calculate_preferred_shards تعداد تازه را حساب می‌کند: تعداد اشیا ضرب در ۲ (یا ۸ در multisite تا reshardها کمتر شوند) تقسیم بر آستانه، محدود به ۱۱ تا rgw_max_dynamic_shards و گرد به نزدیک‌ترین عدد اول بزرگ‌تر یا مساوی از فهرست reshard_primes. در bucket نسخه‌دار آستانه بر ۳ تقسیم می‌شود، چون هر شیء چند ورودی در نمایه دارد. اگر اشیا زیر «شاردها × min(10000, آستانه/100)» برسد، کاهش پیشنهاد می‌شود که پس از rgw_dynamic_resharding_reduction_wait اجرا می‌شود. شارد هر کلید ceph_str_hash_linux آن به پیمانه‌ی ۷۸۷۷ و سپس تعداد شاردهاست؛ فهرست مرتب از هر شارد max(8, 1 + ⌊n/s⌋ + √(2n·ln s / s)) ورودی می‌خواند."
reshard_limit: "bucket وقتی بررسی می‌شود که آمارش همگام می‌شود (RGWOwnerStatsCache::sync_bucket و همگام‌سازی آمار کاربر)، نه در هر نوشتن؛ اینجا این بررسی هر «N شیء تازه» فرض شده است و مثال فصل ۴ همان ۱۰۰ هزار است. thread مربوط به reshard صف را هر rgw_reshard_thread_interval پردازش می‌کند. min_layout_shards صفر است و multisite یعنی zone داده‌ی log نگه می‌دارد. پخش کلیدها برای ۲۰۰۰ نام نمونه با الگوی فصل ۴ است. خروجی‌ها برای موارد آزمون با کد خود Ceph یکسان‌اند (tests/sims/golden-labs.json)."
