bs_s_queue: "OSD تراکنشی به BlueStore می‌دهد؛ یک TransContext در حالت PREPARE ساخته می‌شود."
bs_s_split_s: بُرش در min_alloc
bs_s_split: "_do_write_data نوشتن را به {n} تکه می‌بُرد و هر تکه را به _do_write_small یا _do_write_big می‌فرستد."
bs_s_rmw_s: خواندن سر و دُم
bs_s_rmw: "بازنویسی با block دیسک ۴ KiB هم‌تراز نیست، پس {b} پیرامون آن اول خوانده می‌شود تا بعداً blockهای کامل نوشته شوند."
bs_s_alloc_s: تخصیص
bs_s_alloc: "_do_alloc_write از allocator مقدار {b} در واحدهای min_alloc_size می‌خواهد."
bs_s_aio_s: نوشتن مستقیم
bs_s_aio: "{b} دادهٔ تازه با aio در فضای تازه نوشته می‌شود؛ تراکنش در AIO_WAIT منتظر می‌ماند. دادهٔ قدیمی دست نخورده است، پس crash چیزی را نیمه‌نوشته باقی نمی‌گذارد."
bs_s_defop_s: عملیات deferred
bs_s_defop: "بایت‌هایی که باید در جا نوشته شوند در یک bluestore_deferred_op_t درون همان تراکنش RocksDB قرار می‌گیرند."
bs_s_kv_s: commit در KV
bs_s_kv: "_kv_sync_thread تغییرات onode، extent map و تخصیص را با یک sync در RocksDB commit می‌کند."
bs_s_kv_def_s: commit در KV همراه داده
bs_s_kv_def: "_kv_sync_thread، metadata و دادهٔ deferred را با یک sync در RocksDB commit می‌کند؛ نوشتن WAL تنها نوشتن هم‌زمان روی دیسک است."
bs_s_ack_s: تأیید
bs_s_ack: "پس از commit نوشتن ماندگار است؛ _txc_committed_kv callbackهای OSD را کامل می‌کند و کلاینت می‌تواند تأییدش را بگیرد."
bs_s_defio_s: نوشتن deferred
bs_s_defio: "بعداً و دسته‌دسته (bluestore_deferred_batch_ops)، بایت‌های deferred سر جایشان روی block device نوشته می‌شوند."
bs_s_clean_s: پاک‌سازی
bs_s_clean: "وقتی آن نوشتن روی دیسک رفت، _deferred_aio_finish رکورد deferred را از RocksDB پاک می‌کند."
