pc_pass_first: (بدون autoscale)
pc_pass_second: (غیر bulk)
pc_pass_third: (bulk بزرگ)
pc_pass_fourth: (bulk برابر)
pc_s_budget: نسخه‌های PG مجاز برای root
pc_s_per: نسخهٔ PG به ازای هر OSD (پیشنهادی)
pc_s_now: نسخهٔ PG به ازای هر OSD (فعلی)
pc_note: "autoscaler برای poolی که مدیریت می‌کند هیچ‌وقت زیر ۳۲ PG (osd_pool_default_pg_num) نمی‌رود و اگر bulk روشن نباشد کوچک شروع می‌کند و با داده بزرگ می‌شود."
