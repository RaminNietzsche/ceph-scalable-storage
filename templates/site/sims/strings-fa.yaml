pl_rbd_s2_ec: "شیءهای داده در pool {pool} از نوع erasure-coded نگه داشته می‌شوند و در نامشان شناسهٔ pool فراداده ({md}) هم می‌آید. هر کدام همان گام‌های یک شیء تنها را طی می‌کند، این بار با قاعدهٔ indep و {n} shard؛ با دکمهٔ «گام‌ها» shardهای یک شیء و تقسیم بازهٔ آن به stripeها را ببینید."
pl_c_shards: "shardها"
pl_rbd_s4_ec: "در pool از نوع erasure-coded هر شیء k+m shard دارد، یکی روی هر OSD از مجموعهٔ up آن؛ جایگاه‌های NONE شمرده نمی‌شوند."
pl_rbd_ec_n: "RBD نمی‌تواند فراداده و omap را در poolی از نوع erasure-coded نگه دارد، پس image در poolی از نوع replicated ساخته می‌شود و تنها شیءهای داده با --data-pool به pool از نوع erasure-coded می‌روند. RBD بخش‌هایی از شیءها را بازنویسی می‌کند، پس allow_ec_overwrites باید روی آن pool روشن باشد (تنها روی BlueStore)."
