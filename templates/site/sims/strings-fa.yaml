pl_ix_n: "با indep تنها {a} جایگاه از {n} جایگاه OSD تازه‌ای گرفته‌اند و جایگاه‌هایی که جایی پیدا نکرده‌اند NONE مانده‌اند؛ با firstn، که OSDهای down را حذف می‌کند، {b} جایگاه عوض می‌شود، چون عضوهای بعدی یک خانه جلو می‌آیند."
pl_ix_hint: "یک OSD را در نقشهٔ بالا out یا down کنید تا تفاوت را ببینید."
pl_ix_why: "در pool از نوع erasure-coded جایگاه هر عضو همان شمارهٔ shard است: OSDی که از s1 به s0 برود باید تکهٔ دیگری نگه دارد و همهٔ آن را از نو بسازد. برای همین Ceph در این poolها indep را به کار می‌برد و OSDMap به جای OSD از کار افتاده NONE می‌گذارد. firstn برای نسخه‌های یکسان مناسب است که ترتیبشان اهمیتی ندارد."
pl_s5e_t: "shardها، مجموعهٔ up و acting و primary"
pl_s5e_n: "در pool از نوع erasure-coded هر جایگاه مجموعهٔ up یک shard است: k جایگاه نخست (از s0) تکه‌های داده را نگه می‌دارند و m جایگاه بعدی تکه‌های parity را. تابع OSDMap::_raw_to_up_osds در این poolها OSDهای down را حذف نمی‌کند، بلکه CRUSH_ITEM_NONE را جایشان می‌گذارد که Ceph آن را 2147483647 چاپ می‌کند؛ primary نخستین عضوی است که NONE نیست. هر shard نمونهٔ جداگانه‌ای از PG است و نامش پسوند s و شمارهٔ shard را دارد."
pl_s4e_n: "قاعدهٔ erasure با indep برای هر یک از {n} جایگاه یک {fd} و یک OSD زیر آن برمی‌گزیند. جایگاه‌ها دور به دور پر می‌شوند: در دور f، مقدار r برابر شمارهٔ جایگاه به‌علاوهٔ n*f است (در mapper.c همان r+n*ftotal)، و جایگاهی که انتخابش رد یا تکراری شود تا دور بعد خالی می‌ماند و جایگاه‌های دیگر OSD خود را نگه می‌دارند. اگر پس از choose_tries دور (۱۰۰) جایی پیدا نشود، آن جایگاه NONE می‌شود. سطر برندهٔ هر جدول برجسته است."
pl_s6e_t: "از بایت تا تکه: stripeها و shardها"
pl_s6e_n: "شیء به stripeهایی بریده می‌شود که پهنای هر کدام، stripe_width، برابر k تکه به اندازهٔ chunk_size است. در هر stripe، نخستین chunk_size بایت به shard داده d0 می‌رسد، بعدی به d1 و همین‌طور تا آخر، و m تکهٔ parity از همین k تکه حساب می‌شوند؛ پس stripe شمارهٔ t در هر shard از offset برابر حاصل‌ضرب t در chunk_size نوشته می‌شود. جدول و بازه‌ها همان چیزی است که stripe_info_t در ECUtil حساب می‌کند."
pl_s6e_rmw: "این نوشتن همهٔ stripe را نمی‌پوشاند: در poolی با allow_ec_overwrites، OSD primary بخش دست‌نخوردهٔ آن stripeها را می‌خواند، parity را از نو حساب می‌کند و هر دو را می‌نویسد (read-modify-write)."
