# ---- lab capacity ----
capacity_t: "برنامه‌ریز ظرفیت و نسبت‌های پُری"
capacity_d: "میزبان‌ها، OSDها، نوع pool و داده‌ی ذخیره‌شده را بدهید و ببینید MAX AVAIL چقدر است، کدام OSD سقف را تعیین می‌کند و از دست رفتن یک میزبان کدام OSDها را از nearfull و backfillfull و full رد می‌کند."
capacity_what: "MAX AVAIL در ceph df همان حسابی است که PGMap::get_rule_avail انجام می‌دهد: وزن CRUSH هر OSD زیر ریشه‌ی قاعده بر مجموع وزن‌ها تقسیم می‌شود (با float)، برای هر OSD فضای آزاد منهای بخشی که بالای full_ratio است بر سهم وزنش تقسیم می‌شود و کمینه‌ی این عددها، تقسیم بر raw_used_rate (size یا (k+m)/k)، MAX AVAIL است. پس پُرترین OSD نسبت به وزنش سقف کل pool را تعیین می‌کند (پیکان ▼). وضعیت هر OSD برگردان OSDService::recalc_full_state است و نام هشدارها همان نام‌های OSDMap::check_health است."
capacity_limit: "یک ریشه و یک قاعده؛ داده بر اساس وزن پخش می‌شود و «عدم توازن» آن را به‌شکل خطی از کمتر تا بیشتر از سهم عادلانه کج می‌کند (در کلاستر واقعی توزیع PGها و balancer این را تعیین می‌کنند). میزبان ازدست‌رفته out فرض می‌شود و داده‌اش به نسبت وزن روی بقیه می‌رود؛ وزن CRUSH آن تغییر نمی‌کند، همان‌طور که در Ceph. فراداده‌ی BlueStore، omap و فشرده‌سازی در نظر گرفته نمی‌شوند. برای موارد آزمون، MAX AVAIL و وضعیت‌ها با کد خود Ceph یکسان‌اند (tests/sims/golden-labs.json)."
