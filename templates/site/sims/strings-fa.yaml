peering_t: گام‌به‌گام peering و recovery
peering_d: سه داستان از یک PG با سه نسخه را گام‌به‌گام دنبال کنید و ماشین حالت PeeringState، مجموعه‌های up و acting و لاگ‌های PG را ببینید.
peering_what: "هر گام نقطه‌ای از ماشین حالت PeeringState (در PeeringState.h) است: مسیر برجسته، حالت تودرتویی است که primary در آن قرار دارد. ورودی‌های لاگ PG به شکل epoch'version و شیئی است که به آن دست زده‌اند؛ ورودی تازه سبز، ورودی واگرا قرمز و شیئی که باید بازیابی شود کهربایی است. نام تابع‌ها جایی در کد است که آن گام رخ می‌دهد."
peering_limit: "سه یا چهار OSD، بدون EC و بدون تغییر هم‌زمان نقشه؛ پیام‌ها و زمان‌بندی ساده شده‌اند. ترتیب حالت‌ها و تصمیم‌ها مطابق کد است."
ps_sc: سناریو
sc_l: سناریو
ps_downup: یک OSD می‌افتد و برمی‌گردد
ps_backfill: یک OSD خارج (out) می‌شود (backfill)
ps_divergent: primary با نوشتنی که هیچ‌کس دیگر ندارد از کار می‌افتد
ps_tree: حالت‌های PeeringState
ps_hist: آنچه تا این‌جا رخ داد
ps_empty: لاگ خالی (نسخهٔ تازه)
ps_gone: "حذف‌شده در ادغام لاگ:"
ps_l_new: تازه
ps_l_div: واگرا
ps_l_miss: برای بازیابی
ps_r_primary: primary
ps_r_replica: replica
ps_r_backfill: هدف backfill
ps_r_stray: stray
ps_r_down: down
ps_downup_0_t: هر سه نسخه هم‌گام‌اند
ps_downup_0: "pg 1.7 روی osd.0، ۱ و ۲ در حالت active+clean است. همهٔ لاگ‌ها به 5'3 ختم می‌شوند."
ps_downup_1_t: osd.2 می‌ایستد؛ interval تازه
ps_downup_1: "monitor در epoch 20، osd.2 را down علامت می‌زند. مجموعه‌های up و acting عوض می‌شوند، پس should_restart_peering پاسخ مثبت می‌دهد و start_peering_interval، PG را به Reset و سپس به Started/Primary/Peering می‌برد."
ps_downup_2_t: GetInfo اطلاعات replicaها را جمع می‌کند
ps_downup_2: "build_prior فهرست OSDهایی را می‌سازد که ممکن است در intervalهای گذشته نوشته باشند؛ primary از هر کدام که زنده است pg_info_t اش را می‌پرسد (last_update، last_complete و دنبالهٔ لاگ)."
ps_downup_3_t: GetLog لاگ معتبر را برمی‌گزیند
ps_downup_3: "find_best_info اطلاعاتی را برمی‌گزیند که last_update اش از همه تازه‌تر است (با ترجیح لاگ بلندتر و primary فعلی). osd.0 خودش آن را دارد، پس لاگی برای گرفتن نیست؛ choose_acting مجموعهٔ acting را برابر up نگه می‌دارد."
ps_downup_4_t: active شدن با یک نسخهٔ کم
ps_downup_4: "دو نسخه برای min_size (۲) کافی است؛ پس activate لاگ و info را برای osd.1 می‌فرستد و PG به active+undersized+degraded می‌رود؛ I/O کلاینت ادامه پیدا می‌کند."
ps_downup_5_t: نوشتن روی دو نسخه ادامه دارد
ps_downup_5: "دو نوشتن می‌رسد: 20'4 روی D و 20'5 روی A. هر کدام پیش از تأیید به لاگ PG روی osd.0 و osd.1 اضافه می‌شود؛ osd.2 آن‌ها را نمی‌بیند."
ps_downup_6_t: osd.2 برمی‌گردد؛ interval تازه
ps_downup_6: "در epoch 25، osd.2 دوباره up است و به up و acting برمی‌گردد. peering از نو شروع می‌شود؛ osd.2 به GetInfo با last_update برابر 5'3 پاسخ می‌دهد (proc_replica_notify)."
ps_downup_7_t: GetMissing کمبودهای osd.2 را پیدا می‌کند
ps_downup_7: "primary در proc_replica_log لاگ osd.2 را با لاگ معتبر مقایسه می‌کند: ورودی‌های پس از 5'3 به D و A دست زده‌اند، پس مجموعهٔ missing آن {D, A} است. لاگش هم‌پوشانی دارد، پس بازیابی بر پایهٔ لاگ کافی است (بدون backfill)."
ps_downup_8_t: Recovering شیءها را می‌فرستد
ps_downup_8: "پس از رزرو بازیابی محلی و دوردست، start_recovery_ops تابع recover_replicas را صدا می‌زند که هر شیء گمشده را به osd.2 می‌فرستد (D تمام شده و A در راه است). PG در حالت active+recovering+degraded است و همچنان I/O می‌دهد."
ps_downup_9_t: Recovered و سپس Clean
ps_downup_9: "وقتی چیزی کم نباشد PG از Recovered می‌گذرد و در Clean آرام می‌گیرد: دوباره active+clean روی سه نسخه."
ps_backfill_0_t: هر سه نسخه هم‌گام‌اند
ps_backfill_0: "pg 1.7 روی osd.0، ۱ و ۲ در حالت active+clean است."
ps_backfill_1_t: osd.2 خارج می‌شود؛ CRUSH، osd.3 را برمی‌گزیند
ps_backfill_1: "در epoch 31 مقدار reweight ی osd.2 صفر می‌شود و CRUSH حالا PG را به [0,1,3] می‌نگارد. osd.3 هیچ لاگی ندارد، پس calc_replicated_acting نمی‌تواند آن را در acting بگذارد؛ choose_acting از monitor یک pg_temp برابر [0,1,2] می‌خواهد و در WaitActingChange منتظر می‌ماند."
ps_backfill_2_t: active با pg_temp
ps_backfill_2: "در epoch 32، pg_temp در نقشه است: acting همان [0,1,2] می‌ماند و up برابر [0,1,3] است. activate، osd.3 را به‌عنوان هدف backfill ثبت می‌کند؛ PG در حالت remapped است."
ps_backfill_3_t: انتظار برای نوبت backfill محلی
ps_backfill_3: "backfill محدود می‌شود: primary اول یکی از نوبت‌های osd_max_backfills خودش را می‌گیرد (backfill_wait)."
ps_backfill_4_t: انتظار برای نوبت دوردست
ps_backfill_4: "سپس با MBackfillReserve از osd.3 نوبت می‌خواهد؛ اگر osd.3 بیش از حد پر باشد رد می‌کند (backfill_toofull)."
ps_backfill_5_t: Backfilling به ترتیب hash
ps_backfill_5: "recover_backfill شیءها را به ترتیب hash پیمایش می‌کند و روی osd.3 کپی می‌کند؛ last_backfill نشان می‌دهد تا کجا رسیده است. نوشتن روی شیءهای پیش از این نقطه برای osd.3 هم فرستاده می‌شود."
ps_backfill_6_t: backfill تمام شد
ps_backfill_6: "last_backfill به MAX می‌رسد؛ دیگر چیزی به backfill یا بازیابی نیاز ندارد، پس PG در Recovered است و حذف pg_temp را درخواست می‌کند."
ps_backfill_7_t: Clean روی مجموعهٔ تازه
ps_backfill_7: "در epoch 33 مجموعهٔ acting برابر up یعنی [0,1,3] است و PG در حالت active+clean است. osd.2 حالا برای این PG یک Stray است و نسخهٔ خودش را پاک می‌کند (ToDelete)."
ps_divergent_0_t: primary نوشتنی را لاگ می‌کند
ps_divergent_0: "osd.0 نوشتنی روی D را با 40'4 اجرا و لاگ می‌کند، ولی پیش از آن‌که replicaها آن را داشته باشند از کار می‌افتد (issue_repop هیچ‌وقت کامل نمی‌شود). کلاینت هرگز تأییدی نگرفته است."
ps_divergent_1_t: osd.0 رفته است؛ osd.1 رهبری می‌کند
ps_divergent_1: "در epoch 41 مجموعهٔ acting برابر [1,2] و osd.1 primary است. find_best_info روی هر دو last_update برابر 5'3 می‌یابد؛ 40'4 برایشان ناشناخته است."
ps_divergent_2_t: نوشتن‌های تازه در interval تازه
ps_divergent_2: "PG به active+undersized+degraded می‌رود و دو نوشتن می‌گیرد: 41'4 روی E و 41'5 روی B. حالا نسخه‌های ۴ و ۵ معنایی متفاوت با 40'4 ی osd.0 دارند."
ps_divergent_3_t: osd.0 به‌عنوان primary برمی‌گردد
ps_divergent_3: "در epoch 45، osd.0 برمی‌گردد و CRUSH دوباره آن را primary می‌کند. peering شروع می‌شود و GetInfo اطلاعات را جمع می‌کند."
ps_divergent_4_t: لاگ osd.1 برنده است
ps_divergent_4: "find_best_info مقدارهای last_update را مقایسه می‌کند: 41'5 از 40'4 تازه‌تر است (اول epoch مقایسه می‌شود)، پس لاگ osd.1 معتبر است. osd.0 آن را می‌گیرد و proc_master_log را اجرا می‌کند؛ 40'4 ی آن واگراست."
ps_divergent_5_t: merge_log ورودی واگرا را عقب می‌برد
ps_divergent_5: "merge_log می‌بیند که 40'4 در تاریخچهٔ معتبر نیست: rewind_divergent_log آن را کنار می‌گذارد و _merge_divergent_entries سرنوشت شیء را تعیین می‌کند. D پیش‌تر وجود نداشت، پس حذف می‌شود؛ E و B روی osd.0 در فهرست missing می‌روند."
ps_divergent_6_t: primary کمبودهایش را می‌کشد
ps_divergent_6: "چون خود primary شیء کم دارد، recover_primary آن‌ها را از osd.1 می‌کشد (E تمام شده و B در راه است). خواندن B از سوی کلاینت منتظر آن می‌ماند."
ps_divergent_7_t: Clean، بدون نوشتن گم‌شده
ps_divergent_7: "هر سه لاگ روی 41'5 هم‌نظرند و PG در حالت active+clean است. نوشتن روی D از بین رفته و این درست است: هرگز تأیید نشده بود."
