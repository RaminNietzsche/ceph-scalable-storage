rg_s_prep: "rgw_bucket_prepare_op یک ورودی معلق برای {k} روی shard {sh} از {n} می‌گذارد تا اگر همین حالا crash رخ دهد ردی برای پاک‌سازی بماند."
rg_s_head_s: نوشتن head
rg_s_head: "شیء head با یک write_full همراه ۴ MiB نخست، manifest و attributeها (ETag، ACL و content type) نوشته می‌شود."
rg_s_comp_s: تکمیل index
rg_s_comp: "rgw_bucket_complete_op ورودی معلق را به شیئی فهرست‌شده روی shard {sh} تبدیل می‌کند و برای همگام‌سازی به bucket index log می‌افزاید."
rg_s_ok_s: 200 OK
rg_s_ok: "radosgw با 200 و ETag پاسخ می‌دهد؛ شیء حالا در فهرست‌ها دیده می‌شود."
rg_m_init_s: آغاز
rg_m_init: "POST ?uploads یک بارگذاری multipart را آغاز می‌کند و upload id برمی‌گرداند."
rg_m_meta_s: شیء meta
rg_m_meta: "یک شیء meta در namespace ی multipart ساخته می‌شود که فهرست partها را در omap نگه می‌دارد."
rg_m_part_s: بارگذاری partها
rg_m_part: "کلاینت {p} part را با PUT ?partNumber=N&uploadId=… می‌فرستد؛ هر کدام یک RGWPutObj جداست."
rg_m_pdata_s: دادهٔ part
rg_m_pdata: "هر part به‌صورت یک شیء __multipart_ (۴ MiB نخست) و stripeهای __shadow_ نوشته می‌شود؛ اندازه و ETag آن به omap ی شیء meta افزوده می‌شود."
rg_m_comp_s: تکمیل
rg_m_comp: "POST ?uploadId=… partها را فهرست می‌کند؛ RGWCompleteMultipart مقدارهای ETag و اندازه‌ها را بررسی می‌کند."
rg_m_head_s: head با manifest
rg_m_head: "یک شیء head بدون داده نوشته می‌شود که manifest آن به شیءهای همهٔ partها اشاره می‌کند. سپس شیء meta حذف می‌شود."
rg_m_ok_s: 200 OK
rg_m_ok: "پاسخ ETag ی به شکل md5-of-part-md5s-{p} دارد."
