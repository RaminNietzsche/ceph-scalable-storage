placement_t: از نام شیء تا OSD
placement_d: "نام یک فایل یا شیء را بنویسید و گام‌به‌گام ببینید Ceph آن را چطور hash می‌کند، در کدام PG می‌گذارد و CRUSH با هر یک از پنج الگوریتم bucket کدام OSDها را برایش برمی‌گزیند؛ سپس ببینید افزودن یک OSD، تغییر وزن یا out کردن آن با هر الگوریتم چه سهمی از داده را جابه‌جا می‌کند. با گزینهٔ image از RBD ببینید یک بازه از بایت‌های image در کدام شیءهای rbd_data می‌افتد و هر کدام از آن‌ها، همراه با شیءهای فرادادهٔ image، کجا قرار می‌گیرند. با گزینهٔ erasure-coded ببینید k+m shard کجا می‌روند، جای OSDهای از کار افتاده چطور NONE می‌ماند و یک نوشتن چطور به stripeها و تکه‌ها بریده می‌شود."
placement_what: "کل مسیر ceph osd map، همان‌طور که کلاینت حساب می‌کند. ۱) ceph_str_hash_rjenkins روی بایت‌های UTF-8 نام؛ ۲) ceph_stable_mod با pg_num و ماسک آن شمارهٔ PG را می‌دهد (مقدارهای بزرگ‌تر از pg_num به نیمهٔ پایین تا می‌شوند)؛ ۳) با پرچم hashpspool شمارهٔ PG با pgp_num دوباره کوچک و با شناسهٔ pool درهم می‌شود تا x، ورودی CRUSH، به دست آید؛ ۴) crush_do_rule قاعدهٔ pool (chooseleaf firstn) را روی نقشهٔ root ← host ← OSD اجرا می‌کند که همهٔ bucketهایش الگوریتم انتخابی شما را دارند، و هر قرعهٔ هر bucket نمایش داده می‌شود، همراه با ردشدن‌ها (OSDهای out) و تکرارها که r را بالا می‌برند؛ ۵) OSDMap از مجموعهٔ خام OSDهای down را کنار می‌گذارد تا مجموعهٔ up، مجموعهٔ acting و primary به دست آید. بخش مقایسه اشیای نمونه را پیش و پس از یک تغییر، با هر پنج الگوریتم، جای‌گذاری می‌کند. در حالت RBD، بازهٔ بایت‌ها نخست از Striper::file_to_extents می‌گذرد (با fancy striping وقتی stripe_count بیش از ۱ است)؛ سپس هر شیء داده با نامی به شکل rbd_data.<id>.<objectno>، که شمارهٔ شیء در آن ۱۶ رقم hex است، و نیز شیءهای rbd_directory، rbd_id، rbd_header و rbd_object_map همان پنج گام را طی می‌کنند. در pool از نوع erasure-coded قاعده indep است (crush_choose_indep جایگاه‌ها را دور به دور پر می‌کند)، مجموعهٔ up به جای OSDهای down مقدار NONE را نگه می‌دارد، هر shard نمونه‌ای از PG با نامی مانند 1.2as0 است و stripe_info_t در ECUtil بازه‌های بایت، extentها و اندازهٔ هر shard را می‌دهد؛ در حالت RBD، pool از نوع erasure-coded همان pool داده است و فراداده replicated می‌ماند."
placement_limit: "یک الگوریتم برای همهٔ bucketهای نقشه (Ceph برای هر bucket جداگانه اجازه می‌دهد)؛ poolهای replicated، یا poolهای erasure-coded با reed_sol_van از jerasure یا isa و نگاشت مستقیم تکه‌ها (بدون LRC، SHEC و CLAY؛ نام plugin تنها یک برچسب است و chunk_size با قاعدهٔ jerasure حساب می‌شود؛ بدون بهینه‌سازی‌های تازهٔ EC، خواندن جزئی و نوشتن parity به روش delta)؛ بدون namespace و locator key، pg_temp، upmap، primary affinity، device class و choose_args؛ وزن‌ها اندازه به TiB است. با tunables امروزی دیگر نمی‌توان bucket از نوع tree ساخت و uniform وزن نخستین آیتم را برای همه به کار می‌برد. جابه‌جایی به ازای هر نسخه روی اشیای نمونه شمرده می‌شود. برای این نقشه‌ها نتیجه با هر پنج الگوریتم دقیقاً با کد C خود Ceph یکی است (tests/sims/golden.json). حالت RBD: تنها imageهای فرمت ۲؛ بدون clone و هم‌پوشانی با parent، snapshot، journaling، رمزگذاری و جزئیات krbd؛ pool دادهٔ جداگانه همان نقشه را با قاعدهٔ replicated یا erasure به کار می‌برد. striping و نام شیءها با کد Striper خود Ceph و قالب نام‌های librbd یکی است (tests/sims/golden.json). جای‌گذاری indep با OSDهای out و down، جایگاه‌های NONE، primary و حساب stripeها و تکه‌ها با کد خود Ceph یکی است (crush_choose_indep، OSDMap، ECUtil و jerasure). min_size و وضعیت active ساده شده‌اند: peering، pg_temp و جزئیات بازسازی زیر min_size شبیه‌سازی نمی‌شوند."
