# ---- lab mclock ----
mclock_t: "پروفایل‌های mClock: سهم کلاینت، بازیابی و پس‌زمینه"
mclock_d: "نوع دیسک، پروفایل و بار هر کلاس را بدهید و ببینید هر shard صف OSD ظرفیتش را چطور بین کلاینت، بازیابی و کارهای پس‌زمینه مثل scrub تقسیم می‌کند و چرا یک عملیات ۴ کیلوبایتی روی HDD به اندازه‌ی نیم مگابایت حساب می‌شود."
mclock_what: "ظرفیت هر shard برابر osd_mclock_max_sequential_bandwidth تقسیم بر تعداد shardهاست و reservation و limit پروفایل کسری از همین ظرفیت‌اند (صفر یعنی کمینه یا بی‌نهایت). هزینه‌ی هر عملیات بیشینه‌ی اندازه‌ی آن و cost_per_io = پهنای باند ÷ IOPS است. dmClock اول reservationها را می‌دهد و بعد بقیه را به نسبت weight پخش می‌کند؛ چون عملیاتی که با weight سرویس می‌گیرد از reservation هم کم می‌کند، reservation کفِ سهم است و limit سقف آن."
mclock_limit: "مدل حالت پایدار (سیالی) است نه شبیه‌سازی صف درخواست‌به‌درخواست؛ بار به‌طور یکنواخت بین shardها پخش فرض می‌شود و صف immediate، کلاینت‌های جدا با پروفایل خاص، پروفایل custom و زمان گرسنگی (max_starve_time) نیامده‌اند. ثابت‌های پروفایل و پیش‌فرض‌ها از کد Ceph بررسی شده‌اند."
mclock_r1: "مقادیر سه پروفایل"
