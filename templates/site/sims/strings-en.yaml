pl_ix_t: "indep versus firstn: this PG with every OSD in and up, and with the current map"
pl_ix_all: "all in and up"
pl_ix_now: "now"
pl_ix_n: "With indep only {a} of {n} positions got a new OSD and the ones with no place stay NONE; with firstn, which drops the down OSDs, {b} positions change because the later members move up a slot."
pl_ix_hint: "Mark an OSD out or down in the map above to see the difference."
pl_ix_why: "In an erasure-coded pool the position is the shard number: an OSD that moves from s1 to s0 must hold a different chunk and rebuild all of it. That is why Ceph uses indep for these pools and the OSDMap puts NONE where a down OSD was. firstn suits identical replicas, whose order does not matter."
pl_s5e_t: "Shards, the up and acting sets, and the primary"
pl_s5e_n: "In an erasure-coded pool each position of the up set is a shard: the first k (from s0) hold the data chunks and the next m the parity (coding) chunks. For these pools OSDMap::_raw_to_up_osds does not drop down OSDs but puts CRUSH_ITEM_NONE in their place, which Ceph prints as 2147483647; the primary is the first entry that is not NONE. Each shard is its own instance of the PG, named with an s and the shard number."
pl_s4e_n: "The erasure rule picks, with indep, a {fd} and an OSD under it for each of the {n} positions. Positions are filled in rounds: in round f the draw uses r = position + n×f (r + n·ftotal in mapper.c), and a position whose pick is rejected or repeated stays empty until the next round while the others keep their OSD. If nothing is found after choose_tries rounds (100), the position becomes NONE. The winning row of each table is highlighted."
pl_s6e_t: "From bytes to chunks: stripes and shards"
pl_s6e_n: "The object is cut into stripes of stripe_width = k × chunk_size. In each stripe the first chunk_size bytes go to data shard d0, the next to d1 and so on, and the m parity chunks are computed from those k chunks; stripe t lands at offset t × chunk_size in every shard. The grid and the ranges are what ECUtil's stripe_info_t computes."
pl_s6e_rmw: "This write does not cover whole stripes: in a pool with allow_ec_overwrites the primary reads the untouched part of those stripes, recomputes the parity and writes both (read-modify-write)."
