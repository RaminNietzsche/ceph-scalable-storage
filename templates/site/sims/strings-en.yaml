rg_size: Size (MiB)
rg_mode: Upload
mode_l: Upload
rg_atomic: single PUT
rg_part: Part size (MiB)
rg_layout: RADOS objects of this upload
rg_note: "Default sizes: the head holds up to 4 MiB (rgw_max_chunk_size), stripes are 4 MiB (rgw_obj_stripe_size), a part is at least 5 MiB (rgw_multipart_min_part_size)."
rg_s_objs: RADOS objects
rg_s_shard: bucket index shard
rg_s_size: object size
rg_lanes: client|radosgw|auth|index pool|data pool
