ec_io: losses with I/O still served
ec_repair: read to rebuild one chunk
ec_chunks: chunks
ec_repl: "replicated, size {n}"
ec_note: "The default profile on main is plugin=isa technique=reed_sol_van k=2 m=2; profiles cannot be changed once a pool uses them."
ec_e_lrc1: "LRC: k + m must be a multiple of l."
ec_e_lrc2: "LRC: k must be a multiple of (k + m) / l."
ec_e_lrc3: "LRC: m must be a multiple of (k + m) / l."
ec_e_shec: "SHEC: c must not exceed m."
ec_e_clay: "CLAY needs m ≥ 2 for d to lie between k + 1 and k + m − 1."
ec_e_fd: "{n} chunks but only {d} failure domains: the PGs cannot become active."
ec_w_fd: "Chunks equal the failure domains: after one domain fails there is nowhere to recover to."
