# ---- lab mclock ----
mclock_t: "mClock profiles: client, recovery and background shares"
mclock_d: "Pick the device, the profile and each class's load, and see how one OSD queue shard splits its capacity between clients, recovery and background work such as scrub, and why a 4 KiB op on an HDD is charged like half a megabyte."
mclock_what: "Each shard's capacity is osd_mclock_max_sequential_bandwidth divided by the number of shards, and the profile's reservation and limit are fractions of it (zero means the minimum or no limit). One op costs the larger of its size and cost_per_io = bandwidth ÷ IOPS. dmClock serves reservations first and spreads the rest by weight; since ops served by weight also count against the reservation, the reservation is a floor and the limit a ceiling."
mclock_limit: "A steady-state (fluid) model, not a request-by-request queue simulation; load is assumed spread evenly over the shards, and the immediate queue, per-client profiles, the custom profile and the starvation timer (max_starve_time) are left out. The profile constants and defaults are checked against the Ceph code."
