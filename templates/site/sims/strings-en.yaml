# ---- lab capacity ----
capacity_t: "Capacity and full-ratio planner"
capacity_d: "Give hosts, OSDs, the pool type and the data stored: see MAX AVAIL, which OSD sets that limit, and which OSDs a lost host pushes past nearfull, backfillfull and full."
capacity_what: "MAX AVAIL in ceph df is what PGMap::get_rule_avail computes: each OSD's CRUSH weight under the rule's root is divided by the sum of weights (as float); for every OSD, its free space minus the part above full_ratio is divided by its weight share, and the smallest of these numbers, divided by raw_used_rate (size, or (k+m)/k), is MAX AVAIL. So the OSD that is fullest for its weight sets the limit for the whole pool (the ▼ marker). Each OSD's state is a port of OSDService::recalc_full_state, and the health check names are those of OSDMap::check_health."
capacity_limit: "One root and one rule; data is spread by weight and the imbalance tilts it linearly from below to above the fair share (in a real cluster the PG distribution and the balancer decide this). A lost host is taken as out and its data moves to the rest by weight; its CRUSH weight does not change, as in Ceph. BlueStore metadata, omap and compression are not counted. For the test cases MAX AVAIL and the states equal those of Ceph's own code (tests/sims/golden-labs.json)."
