bs_s_queue: "The OSD hands BlueStore a transaction; a TransContext is created in state PREPARE."
bs_s_split_s: split at min_alloc
bs_s_split: "_do_write_data cuts the write into {n} piece(s) and sends each to _do_write_small or _do_write_big."
bs_s_rmw_s: read head/tail
bs_s_rmw: "The overwrite is not aligned to the 4 KiB disk block, so {b} around it is read first so whole blocks can be written later."
bs_s_alloc_s: allocate
bs_s_alloc: "_do_alloc_write asks the allocator for {b} in min_alloc_size units."
bs_s_aio_s: direct write
bs_s_aio: "{b} of new data is written with aio to the new space; the transaction waits in AIO_WAIT. The old data is untouched, so a crash leaves nothing half-written."
bs_s_defop_s: deferred op
bs_s_defop: "The bytes to be written in place are put into a bluestore_deferred_op_t inside the same RocksDB transaction."
bs_s_kv_s: KV commit
bs_s_kv: "_kv_sync_thread commits the onode, extent map and allocation changes to RocksDB with a sync."
bs_s_kv_def_s: KV commit with data
bs_s_kv_def: "_kv_sync_thread commits the metadata and the deferred data to RocksDB with a sync; the WAL write is the only synchronous disk write."
bs_s_ack_s: ack
bs_s_ack: "After the commit the write is durable; _txc_committed_kv completes the OSD's callbacks and the client can get its ack."
bs_s_defio_s: deferred write
bs_s_defio: "Later, in batches (bluestore_deferred_batch_ops), the deferred bytes are written to their place on the block device."
bs_s_clean_s: cleanup
bs_s_clean: "When that write is on disk, _deferred_aio_finish removes the deferred record from RocksDB."
