# ---- lab mdspin ----
mdspin_t: "CephFS subtrees and MDS pinning"
mdspin_d: "Split /home, /projects and /scratch over MDS ranks: change explicit pins and their inheritance, distributed ephemeral pins and random pins, and see which subtrees max_mds moves."
mdspin_what: "CInode::get_export_pin walks from an inode toward the root and applies the closest policy: an explicit pin gives that rank; a distributed pin splits the parent directory into 2^bits dirfrags (bits grows until it covers factor × max_mds) and puts each frag on a rank with MDCache::hash_into_rank_bucket; a random pin picks a subtree with probability min(ceph.dir.pin.random, mds_export_ephemeral_random_max) and hashes it with the same function. The rank function uses rjhash64 and a jump consistent hash; the dentry name's ceph_str_hash_rjenkins (the default) decides which parent dirfrag a child belongs to. All this arithmetic is ported from the Ceph code."
mdspin_limit: "A small example tree (inodes start at 0x10000000000), evenly split dirfrags and no automatic load balancer; an unpinned subtree stays with its parent on rank zero. The random draw is fixed per inode so re-rendering does not change it; Ceph draws a fresh random number when it loads the inode. A pin to a rank at or above max_mds does not move the subtree until that rank exists. For the test cases the hashes, dirfrags and ranks equal those of Ceph's own code (tests/sims/golden-labs.json)."
