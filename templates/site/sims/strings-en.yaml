crush_t: CRUSH playground
crush_d: Build a root, hosts and OSDs, choose a rule, and watch straw2 place every PG; mark an OSD out or down or change a weight and see which PGs move.
crush_what: "Each PG's seed (pps) is computed as Ceph does, then crush_do_rule runs a jewel-tunables map: a straw2 root of straw2 hosts, the rule that ceph osd pool create makes (chooseleaf firstn for replicated, chooseleaf indep for EC, with host or osd as the failure domain). 'Out' sets the OSD's reweight to 0 (CRUSH skips it); 'down' keeps it in the map but drops it from the up set. The bars are the PG shards per OSD; the thin line is what its weight would give."
crush_limit: "No pg_temp, upmap, primary affinity or device classes; the weight of each OSD is its size in TiB. For these maps the outputs match Ceph's C code exactly (tests/sims/golden.json)."
