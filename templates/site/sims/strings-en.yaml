sc_l: Scenario
ps_downup: An OSD goes down and comes back
ps_backfill: An OSD is marked out (backfill)
ps_divergent: The primary crashes with a write nobody else has
ps_tree: PeeringState states
ps_hist: What happened so far
ps_empty: empty log (a new replica)
ps_gone: "removed by the log merge:"
ps_l_new: new
ps_l_div: divergent
ps_l_miss: to recover
ps_r_primary: primary
ps_r_replica: replica
ps_r_backfill: backfill target
ps_r_stray: stray
ps_r_down: down
ps_downup_0_t: All three copies are in step
ps_downup_0: "pg 1.7 is active+clean on osd.0, 1, 2. Every log ends at 5'3."
ps_downup_1_t: osd.2 stops; a new interval starts
ps_downup_1: "The monitor marks osd.2 down in epoch 20. The up and acting sets change, so should_restart_peering says yes and start_peering_interval sends the PG back to Reset and then into Started/Primary/Peering."
ps_downup_2_t: GetInfo collects the replicas' info
ps_downup_2: "build_prior lists the OSDs that might have written in past intervals; the primary asks each living one for its pg_info_t (last_update, last_complete, log tail)."
ps_downup_3_t: GetLog picks the authoritative log
ps_downup_3: "find_best_info picks the info with the newest last_update (preferring longer logs and the current primary). osd.0 already has it, so there is no log to fetch; choose_acting keeps acting = up."
ps_downup_4_t: Activate with one copy missing
ps_downup_4: "Two copies satisfy min_size (2), so activate sends the log and info to osd.1 and the PG goes active+undersized+degraded; client I/O resumes."
ps_downup_5_t: Writes continue on two copies
ps_downup_5: "Two writes arrive: 20'4 on D and 20'5 on A. Each is appended to the PG log on osd.0 and osd.1 before it is acknowledged; osd.2 does not see them."
ps_downup_6_t: osd.2 returns; a new interval
ps_downup_6: "In epoch 25 osd.2 is up again and back in up and acting. Peering starts over; osd.2 answers GetInfo with last_update 5'3 (proc_replica_notify)."
ps_downup_7_t: GetMissing works out what osd.2 lacks
ps_downup_7: "The primary compares osd.2's log with the authoritative one in proc_replica_log: the entries after 5'3 touched D and A, so its missing set is {D, A}. Its log overlaps, so log-based recovery is enough (no backfill)."
ps_downup_8_t: Recovering pushes the objects
ps_downup_8: "After the local and remote recovery reservations, start_recovery_ops calls recover_replicas, which pushes each missing object to osd.2 (D is done, A is in flight). The PG is active+recovering+degraded and keeps serving I/O."
ps_downup_9_t: Recovered, then Clean
ps_downup_9: "When nothing is missing the PG passes Recovered and settles in Clean: active+clean again on three copies."
ps_backfill_0_t: All three copies are in step
ps_backfill_0: "pg 1.7 is active+clean on osd.0, 1, 2."
ps_backfill_1_t: osd.2 is out; CRUSH picks osd.3
ps_backfill_1: "In epoch 31 osd.2's reweight becomes 0, so CRUSH now maps the PG to [0,1,3]. osd.3 has no log at all, so calc_replicated_acting cannot put it in acting; choose_acting asks the monitor for a pg_temp of [0,1,2] and waits in WaitActingChange."
ps_backfill_2_t: Active with pg_temp
ps_backfill_2: "In epoch 32 the pg_temp is in the map: acting stays [0,1,2] while up is [0,1,3]. activate records osd.3 as a backfill target; the PG is remapped."
ps_backfill_3_t: Waiting for the local backfill slot
ps_backfill_3: "Backfill is throttled: the primary first takes one of its own osd_max_backfills slots (backfill_wait)."
ps_backfill_4_t: Waiting for the remote slot
ps_backfill_4: "Then it asks osd.3 for a slot with MBackfillReserve; if osd.3 is too full it refuses (backfill_toofull)."
ps_backfill_5_t: Backfilling, in hash order
ps_backfill_5: "recover_backfill walks the objects in hash order and copies them to osd.3; last_backfill marks how far it has come. Writes to objects below that point are also sent to osd.3."
ps_backfill_6_t: Backfill done
ps_backfill_6: "last_backfill reaches MAX; nothing needs backfill or recovery, so the PG is Recovered and asks for the pg_temp to be removed."
ps_backfill_7_t: Clean on the new set
ps_backfill_7: "In epoch 33 acting = up = [0,1,3] and the PG is active+clean. osd.2 is now a Stray for this PG and deletes its copy (ToDelete)."
ps_divergent_0_t: The primary logs a write
ps_divergent_0: "osd.0 executes a write to D as 40'4 and logs it, but crashes before the replicas have it (issue_repop never completes). The client never got an ack."
ps_divergent_1_t: osd.0 is gone; osd.1 leads
ps_divergent_1: "In epoch 41 acting is [1,2] and osd.1 is primary. find_best_info finds last_update 5'3 on both; 40'4 is unknown to them."
ps_divergent_2_t: New writes in the new interval
ps_divergent_2: "The PG goes active+undersized+degraded and takes two writes: 41'4 on E and 41'5 on B. Versions 4 and 5 now mean something different from osd.0's 40'4."
ps_divergent_3_t: osd.0 returns as primary
ps_divergent_3: "In epoch 45 osd.0 is back and CRUSH makes it primary again. Peering starts; GetInfo collects the infos."
ps_divergent_4_t: The log of osd.1 wins
ps_divergent_4: "find_best_info compares last_update: 41'5 is newer than 40'4 (the epoch is compared first), so osd.1's log is authoritative. osd.0 fetches it and runs proc_master_log; its 40'4 is divergent."
ps_divergent_5_t: merge_log rewinds the divergent entry
ps_divergent_5: "merge_log sees that 40'4 is not in the authoritative history: rewind_divergent_log drops it and _merge_divergent_entries decides the object's fate. D did not exist before, so it is removed; E and B become missing on osd.0."
ps_divergent_6_t: The primary pulls what it lacks
ps_divergent_6: "Because the primary itself is missing objects, recover_primary pulls them from osd.1 (E is done, B is in flight). A client read of B waits for it."
ps_divergent_7_t: Clean, without the lost write
ps_divergent_7: "All three logs agree on 41'5 and the PG is active+clean. The write to D is gone, which is correct: it was never acknowledged."
