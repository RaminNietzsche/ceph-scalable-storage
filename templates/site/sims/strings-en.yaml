r_ps_rec: log-based recovery and backfill

bluestore_t: BlueStore write path
bluestore_d: Choose the device, offset and length of a write and watch BlueStore split it and decide what goes through the WAL (deferred) and what is written directly.
bluestore_what: "This is the classic write path (bluestore_write_v2 is false by default). _do_write_data cuts the write at min_alloc_size into an unaligned head, an aligned middle and an unaligned tail. An overwrite of space that is already allocated becomes a deferred write: it is put in the RocksDB transaction, acknowledged after the commit, and copied to its place later. New data goes to freshly allocated space; if the whole write's new data is smaller than prefer_deferred_size it is deferred as well, otherwise it is written with aio before the commit."
bluestore_limit: "No compression, checksums, blob reuse or garbage collection; one mutable blob per region is assumed. The decision rules and the transaction states follow BlueStore.cc."
