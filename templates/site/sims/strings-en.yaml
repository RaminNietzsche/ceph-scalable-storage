pgcalc_t: PG count calculator
pgcalc_d: "Give the OSD count and each pool's share of the data: see the classic pgcalc answer and what the pg_autoscaler would choose, pass by pass."
pgcalc_what: "The autoscaler part is a port of module.py on Ceph main: the root's budget is mon_target_pg_per_osd × OSDs; pools that are not autoscaled come first, then non-bulk pools, then bulk pools that need more than an even share, then the rest evenly. In each pass a knapsack rounds every group of pools up or down to a power of two within the remaining budget. A change is only proposed when it passes the threshold (3×; 1× near 512 and 1024, 2× near 2048)."
pgcalc_limit: "One CRUSH root, the share is given as capacity_ratio (target_size_ratio), bias 1, no pg_num_max. The outputs match the real module.py for the test cases."
