pl_cmp_note: "'Least needed' is what a perfect placement would move to reach the new per-OSD shares: the sum of what each OSD gains. No hierarchical placement reaches it exactly, because objects that enter or leave a host are drawn again inside it, and with several replicas a host that wins an earlier slot pushes the others along. What separates the algorithms is the rest (in orange): straw2 never moves data between two items whose weights did not change; uniform redraws everything when a bucket grows or shrinks (add a host) and ignores weights; list and tree depend on where the item sits (remove the second host, or an OSD in the middle of a host). Marking an OSD out costs the same with all five, since CRUSH only rejects it and draws again."
pl_cmp_note_alg: "Converting the buckets changes the draws, and how much moves depends on the pair. straw to straw2 moves little when the weights in a bucket are equal, because both then pick the largest hash (that is why ceph osd crush set-all-straw-buckets-to-straw2 is cheap); with unequal weights, or to and from uniform, list and tree, most of the data moves."
