# ---- lab ecdecode ----
ecdecode_t: "Erasure coding: split, lose, rebuild"
ecdecode_d: "Split a text into k data chunks and m parity chunks, fail any shards you like, and see which chunks are read and how the text comes back by inverting a matrix in GF(2⁸)."
ecdecode_what: "Each parity byte is the sum (XOR) of the coding matrix coefficients times the data bytes in GF(2⁸) with polynomial 0x11d. The matrix is the one jerasure (reed_sol_vandermonde_coding_matrix) or ISA-L (gf_gen_rs_matrix) builds for technique=reed_sol_van. On a read, if every data chunk is healthy only those are read; otherwise the first k available chunks are picked and their rows inverted (ErasureCode::_minimum_to_decode)."
ecdecode_limit: "One stripe and a small object; the chunk size is the text length divided by k, and stripe_unit alignment, compression and partial writes (EC optimizations) are not shown. Matrices and parity are checked against the jerasure and ISA-L C code."
