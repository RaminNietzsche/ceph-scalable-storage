peering_t: Peering and recovery stepper
peering_d: Step through three stories of one PG with three replicas and watch the PeeringState machine, the up and acting sets and the PG logs.
peering_what: "Each step is one point in the PeeringState state machine (PeeringState.h): the highlighted path is the nested state the primary is in. The PG log entries are epoch'version and the object they touched; a new entry is green, a divergent one red, an object that must be recovered amber. The function names are where each step happens in the code."
peering_limit: "Three or four OSDs, no EC, no concurrent map changes; messages and timings are simplified. The order of states and the decisions follow the code."
