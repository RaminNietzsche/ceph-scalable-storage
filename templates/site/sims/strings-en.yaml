rgwput_t: RGW PUT and multipart
rgwput_d: Give a key and a size and follow an S3 PUT through radosgw to the bucket index and the data pool, with the RADOS objects it creates.
rgwput_what: "The tail stripes are written while the body streams in; only then is the bucket index shard prepared (cls rgw_bucket_prepare_op), the head object written with its manifest and attributes, and the index entry completed (rgw_bucket_complete_op, which also writes the bucket index log). The shard is ceph_str_hash_linux of the key, folded and taken modulo a prime and the shard count. A multipart upload writes each part as its own objects and the final complete writes only a head with a manifest that lists the parts."
rgwput_limit: "One zone, no versioning, encryption, compression or object lock; object names use MARKER for the bucket marker and placeholders for random parts. The shard numbers are exact."
