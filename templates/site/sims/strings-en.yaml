striping_t: RBD striping mapper
striping_d: "Set an image's object size, stripe_unit and stripe_count and an I/O's offset and length: see which rbd_data objects it touches and where."
striping_what: "librbd hands every I/O to the Striper. The image is cut into stripe units that are dealt round-robin to stripe_count objects; when those objects are full the next object set starts. Each object is named rbd_data.<image id>. and its number in 16 hex digits. With stripe_count 1 (the default) stripe_unit is the object size and the image is simply cut into consecutive objects."
striping_limit: "Only the data objects; the header, id and object-map objects are not shown (the From object name to OSD lab shows them in its RBD mode). The extents are exactly what Striper::file_to_extents returns (checked against Ceph's own Striper code and its test vectors)."
