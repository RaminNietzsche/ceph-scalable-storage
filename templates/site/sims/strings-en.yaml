rg_s_tail_s: tail stripes
rg_s_tail: "As the body streams in, the processor writes {t} tail object(s) of 4 MiB to the data pool."
rg_s_prep_s: index prepare
rg_s_prep: "rgw_bucket_prepare_op marks a pending entry for {k} on shard {sh} of {n}, so a crash now leaves a trace that can be cleaned up."
rg_s_head_s: head write
rg_s_head: "The head object is written in one write_full with the first 4 MiB, the manifest and the attributes (ETag, ACL, content type)."
rg_s_comp_s: index complete
rg_s_comp: "rgw_bucket_complete_op turns the pending entry into a listed object on shard {sh} and appends to the bucket index log for sync."
rg_s_ok_s: 200 OK
rg_s_ok: "radosgw answers 200 with the ETag; the object is now visible in listings."
rg_m_init_s: initiate
rg_m_init: "POST ?uploads starts a multipart upload and returns an upload id."
