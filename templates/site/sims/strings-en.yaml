mclock_s_used: "capacity used"
mclock_ph_res: "The reservations in use add up to more than the capacity (in high_client_ops they sum to 105%), so only the reservation phase runs and each class gets a share in proportion to its reservation."
mclock_ph_wgt: "The shard is full: each class gets at least its reservation and the rest is spread by weight, up to its limit and its own demand."
mclock_ph_idle: "Demand is below capacity and every class is served in full (except what a limit caps); the profile only matters when the device is busy."
mclock_note: "Replace the IOPS with your device's real figure (the osd bench result): if it is too high, cost_per_io shrinks, mClock thinks small ops are cheap and the shares stop protecting clients. To speed up recovery after a failure, switch to high_recovery_ops for a while and then switch back (chapter 7)."
