# ---- lab reshard ----
reshard_t: "Bucket index shards and dynamic reshard"
reshard_d: "Grow a bucket to millions of objects and see when dynamic reshard splits it and into how many shards, how keys spread over the shards, and how many entries one page of an ordered listing reads from them."
reshard_what: "Each time a bucket passes shards × rgw_max_objs_per_shard, check_bucket_shards queues it for reshard and calculate_preferred_shards computes the new count: the object count times 2 (or 8 in multisite, so that there are fewer reshards) divided by the threshold, kept between 11 and rgw_max_dynamic_shards and rounded up to the nearest prime in the reshard_primes list. In a versioned bucket the threshold is divided by 3, because each object has several index entries. If the objects drop below shards × min(10000, threshold / 100), a reduction is proposed, carried out after rgw_dynamic_resharding_reduction_wait. A key's shard is its ceph_str_hash_linux modulo 7877, then modulo the shard count; an ordered listing reads max(8, 1 + ⌊n/s⌋ + √(2n·ln s / s)) entries from every shard."
reshard_limit: "A bucket is checked when its stats are synced (RGWOwnerStatsCache::sync_bucket and the user stats sync), not at every write; here that check is taken to happen every N new objects, and the chapter 4 example uses 100k. The reshard thread processes its queue every rgw_reshard_thread_interval. min_layout_shards is zero, and multisite means the zone keeps a data log. The key spread is for 2000 sample names with the chapter 4 pattern. For the test cases the outputs equal those of Ceph's own code (tests/sims/golden-labs.json)."
