pl_rbd_s1_t: From image bytes to data objects
pl_rbd_s1_n: "librbd hands the range to the Striper (Striper::file_to_extents). The image is cut into stripe units that are dealt round-robin over stripe_count objects; once those objects are full the next object set begins. Each object gets a single extent of its own bytes, and the image ranges that fill it are listed next to it. With stripe_count 1 (the default) the stripe unit is the object size and the image is simply cut into consecutive objects."
