mdspin_note: "mds_export_ephemeral_random_max defaults to only 0.01; even ceph.dir.pin.random=0.5 selects no more than 1% of directories unless you change that cap. A closer explicit pin overrides an inherited pin. More max_mds needs enough standbys for the new ranks, and splitting dirfrags can cause more movement than the jump hash alone (chapter 6)."
