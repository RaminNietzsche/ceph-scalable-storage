pl_rbd_s2_n: "Every data object is an ordinary RADOS object in pool {pool} and goes through the same five steps as a single object: the name's hash, the PG, pps, CRUSH and the up set. Use Steps to open them for one object."
pl_rbd_s2_dp: "With --data-pool the data objects live in pool {pool} and their names carry the metadata pool's id ({md}); they go through the same five steps as a single object, with the data pool's id and pg_num. Use Steps to open them for one object."
pl_rbd_s3_t: The image's metadata objects
pl_rbd_s3_n: "Every format 2 image has these objects in pool {md}, even with a separate data pool: rbd_directory maps names to ids for all the images of the pool; rbd_id.<name> holds the image's id; rbd_header.<id> keeps the size, order, features, snapshots and watchers (mostly in omap); rbd_object_map.<id> holds two bits per data object when the object-map feature is on (the default). They are placed exactly like data objects."
pl_rbd_s4_t: The whole image
pl_rbd_s4_n: "Every object of the image, counted as if all of them were written: RBD is thin-provisioned, and an object exists only once something has been written into it. The table shows how many replicas of these objects each OSD would hold and for how many it would be the primary."
