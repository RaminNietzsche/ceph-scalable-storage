# ---- lab scrub ----
scrub_t: "Scrub scheduler: jitter and the night window"
scrub_d: "Draw scrub times for a group of PGs and see how the allowed-hour window delays them; compare uniform shallow jitter with the clipped normal distribution of deep scrubs."
scrub_what: "Shallow is spread from interval to interval × (1+ratio). Deep uses a normal distribution with standard deviation interval × CV, clipped at two standard deviations; CV=0.2 gives 0.6–1.4 times interval. The hour window is half-open, can cross midnight, and equal start/end means all day."
scrub_limit: "All PGs last finished at the origin. This chart shows targets and the first allowed hour, not actual execution: concurrency, replica reservations, CPU load, random backoff, recovery and mClock can delay work further. The seeded generator is for repeatable teaching, not Ceph's generator."
