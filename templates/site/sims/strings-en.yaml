placement_t: From object name to OSD
placement_d: "Type a file or object name and follow, step by step, how Ceph hashes it, which PG it falls into and which OSDs CRUSH picks for it with each of the five bucket algorithms; then see how much data an added OSD, a new weight or an out OSD moves with each algorithm. Switch to an RBD image to see which rbd_data objects a byte range of the image falls into, and where each of them and the image's metadata objects land. Switch the pool to erasure-coded to see where the k+m shards go, how missing OSDs leave NONE holes and how a write is cut into stripes and chunks."
placement_what: "The whole path of ceph osd map, computed the way the client computes it. 1) ceph_str_hash_rjenkins of the name's UTF-8 bytes; 2) ceph_stable_mod with pg_num and its mask gives the PG number (values above pg_num fold into the lower half); 3) with hashpspool the PG number is reduced with pgp_num and hashed with the pool id into x, the CRUSH input; 4) crush_do_rule runs the pool's rule (chooseleaf firstn) on a root -> host -> OSD map whose buckets all use the algorithm you choose, and every draw of every bucket is shown, with rejections (out OSDs) and collisions that raise r; 5) the OSDMap drops down OSDs from the raw set to give the up set, the acting set and the primary. The comparison places sample objects before and after one change, for all five algorithms. In RBD mode the byte range first goes through Striper::file_to_extents (with fancy striping when stripe_count is above 1); each rbd_data.<id>.<16 hex digits> object, and the rbd_directory, rbd_id, rbd_header and rbd_object_map objects, then go through the same five steps. For an erasure-coded pool the rule is chooseleaf indep (crush_choose_indep fills the positions in rounds), the up set keeps NONE in place of down OSDs, each shard is an instance of the PG such as 1.2as0, and ECUtil's stripe_info_t gives each shard's byte ranges, extents and size; in RBD mode the erasure-coded pool is the data pool and the metadata stays replicated."
placement_limit: "One algorithm for every bucket of the map (Ceph allows one per bucket); replicated pools, or erasure-coded ones with jerasure or isa reed_sol_van and the identity chunk mapping (no LRC, SHEC or CLAY; the plugin is only a label and chunk_size follows jerasure; no EC optimizations, partial reads or parity-delta writes); no namespace or locator key, pg_temp, upmap, primary affinity, device classes or choose_args; weights are sizes in TiB. tree buckets can no longer be created with today's tunables and uniform uses its first item's weight for all items. Movement is counted per replica over the sample objects. For these maps the result is exactly that of Ceph's own C code for all five algorithms (tests/sims/golden.json). RBD mode: format 2 images only; no clones or parent overlap, snapshots, journaling, encryption or krbd specifics; a separate data pool uses the same map, with the replicated or the erasure rule. The striping and the object names match Ceph's own Striper code and librbd's name formats (tests/sims/golden.json). The indep placement with out and down OSDs, the NONE holes, the primary and the stripe and chunk math match Ceph's own code (crush_choose_indep, OSDMap, ECUtil, jerasure). min_size and the active state are simplified: no peering, pg_temp or recovery-below-min_size details."
