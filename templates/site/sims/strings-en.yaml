ecprofile_t: Replication or erasure coding
ecprofile_d: Choose k, m and the plugin and compare usable capacity, overhead, the failures each layout survives and the cost of repairing one chunk.
ecprofile_what: "EC stores k data chunks and m coding chunks on k+m OSDs (LRC adds one local chunk per group of l). The monitor sets min_size to k + min(1, m − 1), so an EC pool keeps serving I/O with one chunk lost but stops before it would run without redundancy; a replicated pool gets size − ⌊size/2⌋. Repair cost is how many chunks must be read to rebuild one: k for Reed-Solomon (isa, jerasure), l for LRC, d/(d−k+1) chunk-equivalents for CLAY."
ecprofile_limit: "Capacity ignores BlueStore metadata, min_alloc padding of small objects, and the 85% nearfull headroom (shown separately as practical). SHEC's repair figure is the book's approximation."
