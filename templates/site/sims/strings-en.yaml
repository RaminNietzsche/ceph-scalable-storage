# ---- lab quorum ----
quorum_t: "Monitor quorum under a network partition"
quorum_d: "Split the network, switch monitors off and see which side can elect a leader; then step from election to a Paxos commit."
quorum_what: "In the classic algorithm, the lowest rank in a fully connected group becomes leader if more than half the monmap acknowledges it. Two disjoint groups cannot both have a majority. A partition does not shrink the required count."
quorum_limit: "Groups are fully connected internally and fully disconnected from each other; message delays, transients, connectivity and disallow are not simulated. This is a steady-state model and protocol walkthrough, not a Paxos implementation."
quorum_r1: "Classic election"
quorum_r2: "Majority condition"
quorum_r3: "Acceptance and timeouts"
quorum_n: "Monmap size"
quorum_split: "Ranks in upper partition"
quorum_toggle: "Press a mon button to fail or restore it. Green is the leader; faded means down."
quorum_fig: "Monitor groups and leader"
quorum_yes: "{n} members; need {q}; leader mon.{l}"
quorum_no: "{n} members; need {q}; no quorum"
quorum_s_need: "majority needed"
quorum_s_fail: "failures tolerated (fully connected)"
quorum_s_lead: "steady-state leader"
quorum_step0: "1. PROPOSE in an odd epoch"
quorum_body0: "Monitors propose themselves; classic defers to a lower rank. A newer epoch can restart the election."
quorum_step1: "2. ACK and victory"
quorum_body1: "After the timeout, acknowledgements from more than half the monmap suffice; all acknowledgements allow an early victory. An even epoch marks the completed election."
quorum_step2: "3. COLLECT and LAST"
quorum_body2: "The new leader collects quorum members' accepted state so a previously accepted value is not lost; this is distinct from the leader election."
quorum_step3: "4. BEGIN, ACCEPT, COMMIT"
quorum_body3: "The leader proposes a value and peons acknowledge acceptance. Ceph waits for ACCEPT from all members of the current quorum, which is already a monmap majority. A missing reply triggers a timeout and a new election."
quorum_step4: "5. LEASE and LEASE_ACK"
quorum_body4: "A lease permits reads of committed state while valid. The leader renews it; missing acknowledgements or expiry trigger a new election. Stable clocks and networking matter."
quorum_note: "MON is not on every data read/write path; losing quorum is not identical to immediately stopping every existing I/O, but map updates and new authentication are affected."
# ---- end quorum ----
