# Weekly report-only checks: external links (lychee) and a best-effort comparison
# of Ceph CLI subcommands/flags used in the book against the latest docs.
# Failures are written to a GitHub issue; they do not fail the workflow.
name: weekly

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check external links (lychee, report-only)
        id: lychee
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          fail: false
          output: lychee.md
          args: >-
            --no-progress
            --max-concurrency 8
            --timeout 20
            --retry-wait-time 3
            --exclude-mail
            --exclude-path node_modules
            --exclude-path build
            --exclude-path dist
            --exclude-path .git
            README.md CHANGELOG.md CONTRIBUTING.md NOTICE.md LICENSE
            docs content templates references CITATION.cff
      - name: Compare book CLI usage with the latest Ceph docs (report-only)
        continue-on-error: true
        run: |
          pip install -q requests beautifulsoup4 lxml
          python3 tools/check_ceph_commands.py --out ceph-commands.md || true
      - name: Open or update the weekly report issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/update_weekly_issue.py
