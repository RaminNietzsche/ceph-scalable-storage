# Weekly report-only checks: external links (lychee) and the book's Ceph command
# lines checked against the Ceph source (main and the release branches).
# Failures are written to a GitHub issue; they do not fail the workflow.
name: weekly

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check external links (lychee, report-only)
        id: lychee
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          fail: false
          output: lychee.md
          # options live in lychee.toml (web links only, #fragments checked, example hosts excluded)
          args: >-
            --config lychee.toml
            --no-progress
            README.md CHANGELOG.md CONTRIBUTING.md NOTICE.md LICENSE
            docs content templates CITATION.cff
            references/references.json references/ceph-release-changes.yaml
      - name: Check the book's Ceph command lines against the Ceph source (report-only)
        continue-on-error: true
        run: |
          pip install -q pyyaml
          # clones ceph/ceph main and the release branches named by the block badges
          # (shallow, sparse: src/ only) and runs the real ceph argument parser
          python3 tools/check_ceph_commands.py --out ceph-commands.md || true
      - name: Open or update the weekly report issue
        env:
          GH_TOKEN: ${{ github.token }}
          LYCHEE_EXIT: ${{ steps.lychee.outputs.exit_code }}
        run: python3 tools/update_weekly_issue.py
